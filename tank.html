// ===== 模块: core/CollisionDetector.js =====
// CollisionDetector 碰撞检测器

class CollisionDetector {
  constructor(map) {
    this.map = map;
  }

  setMap(map) {
    this.map = map;
  }

  // 子弹与瓦片碰撞
  checkBulletTiles(bullet) {
    var bounds = bullet.getBounds();
    var cx = bounds.x + bounds.w / 2;
    var cy = bounds.y + bounds.h / 2;
    var col = Math.floor(cx / TILE_SIZE);
    var row = Math.floor((cy - MAP_OFFSET_Y) / TILE_SIZE);
    var tile = this.map.getTile(row, col);

    if (isBlockedForBullet(tile)) {
      return { hit: true, row, col, tile, destructible: isDestructible(tile) };
    }
    return { hit: false };
  }

  // 子弹与坦克碰撞
  checkBulletTanks(bullet, tanks) {
    var b = bullet.getBounds();
    for (var tank of tanks) {
      if (!tank.alive) continue;
      // 玩家子弹不能打玩家，敌人子弹不能打敌人
      var bulletIsPlayer = bullet.owner === 'player';
      var tankIsPlayer = tank.type === 'player';
      if (bulletIsPlayer === tankIsPlayer) continue;

      var t = tank.getBounds();
      if (rectIntersect(b, t)) {
        return { hit: true, tank };
      }
    }
    return { hit: false };
  }

  // 子弹与子弹碰撞
  checkBulletBullets(bullet, otherBullets) {
    var b = bullet.getBounds();
    for (var other of otherBullets) {
      if (other === bullet || !other.alive) continue;
      // 玩家子弹与敌人子弹相撞
      if (bullet.owner !== other.owner) {
        var o = other.getBounds();
        if (rectIntersect(b, o)) {
          return { hit: true, other };
        }
      }
    }
    return { hit: false };
  }

  // 子弹与基地碰撞
  checkBulletBase(bullet, base) {
    if (!base.alive) return { hit: false };
    var b = bullet.getBounds();
    var baseBounds = base.getBounds();
    if (rectIntersect(b, baseBounds)) {
      return { hit: true, base };
    }
    return { hit: false };
  }
}

// ===== 模块: core/InputManager.js =====
// InputManager 输入管理器（支持键盘 + 虚拟按键 + 触摸）

class InputManager {
  constructor(canvas) {
    this.canvas = canvas;
    this.pressed = new Set();
    this.justPressed = new Set();
    this.mouseX = 0;
    this.mouseY = 0;
    this.mouseJustClicked = false;

    this._bindKeyboard();
    this._bindMouse();
    this._bindTouchControls();
  }

  _bindKeyboard() {
    window.addEventListener('keydown', (e) => {
      var action = KeyToAction[e.code];
      if (action) {
        if (!this.pressed.has(action)) {
          this.justPressed.add(action);
        }
        this.pressed.add(action);
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      var action = KeyToAction[e.code];
      if (action) {
        this.pressed.delete(action);
        e.preventDefault();
      }
    });

    // 阻止方向键和空格滚动页面
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
    }, { passive: false });
  }

  _bindMouse() {
    var getCanvasCoords = (clientX, clientY) => {
      var rect = this.canvas.getBoundingClientRect();
      var scaleX = this.canvas.width / rect.width;
      var scaleY = this.canvas.height / rect.height;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    };

    this.canvas.addEventListener('mousemove', (e) => {
      var coords = getCanvasCoords(e.clientX, e.clientY);
      this.mouseX = coords.x;
      this.mouseY = coords.y;
    });

    this.canvas.addEventListener('mousedown', () => {
      this.mouseJustClicked = true;
    });

    this.canvas.addEventListener('mouseup', () => {
      this.mouseJustClicked = false;
    });

    // 画布触摸事件（tap 转 click，用于菜单/结算界面）
    this.canvas.addEventListener('touchstart', (e) => {
      if (e.target !== this.canvas) return;
      var touch = e.touches[0];
      var coords = getCanvasCoords(touch.clientX, touch.clientY);
      this.mouseX = coords.x;
      this.mouseY = coords.y;
      this.mouseJustClicked = true;
    }, { passive: true });

    this.canvas.addEventListener('touchmove', (e) => {
      if (e.target !== this.canvas) return;
      var touch = e.touches[0];
      var coords = getCanvasCoords(touch.clientX, touch.clientY);
      this.mouseX = coords.x;
      this.mouseY = coords.y;
    }, { passive: true });
  }

  _bindTouchControls() {
    var container = document.getElementById('mobile-controls');
    if (!container) return;

    var buttons = container.querySelectorAll('[data-action]:not([data-action="wheel"])');
    var dpadTouchActive = false;
    var dpadTouchId = null; // 追踪 D-Pad 上的触摸点 identifier
    var dpadWheel = container.querySelector('.dpad-wheel');

    var onDown = (action) => {
      if (!this.pressed.has(action)) {
        this.justPressed.add(action);
      }
      this.pressed.add(action);
      // 同步滑轮方向指示器
      if (dpadWheel && ['up', 'down', 'left', 'right'].includes(action)) {
        dpadWheel.classList.add('active', action);
      }
    };

    var onUp = (action) => {
      this.pressed.delete(action);
      // 同步清除滑轮方向指示器
      if (dpadWheel && ['up', 'down', 'left', 'right'].includes(action)) {
        dpadWheel.classList.remove(action);
        // 如果所有方向都释放，移除激活态
        if (!this.pressed.has('up') && !this.pressed.has('down') &&
            !this.pressed.has('left') && !this.pressed.has('right')) {
          dpadWheel.classList.remove('active');
        }
      }
    };

    buttons.forEach((btn) => {
      var action = btn.dataset.action;

      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        btn.classList.add('active');
        // 方向按钮：不调用onDown，让D-Pad的touchstart统一处理（支持连续滑动）
        // 非方向按钮（pause/fire）：直接调用onDown
        if (action === 'pause' || action === 'fire') {
          onDown(action);
        }
        // 不调用 e.stopPropagation()，让事件冒泡到 D-Pad 触发滑动模式
      }, { passive: false });

      btn.addEventListener('touchend', (e) => {
        e.preventDefault();
        btn.classList.remove('active');
        // 方向按钮：不调用onUp，让D-Pad的endDpadTouch统一处理
        // 非方向按钮（pause/fire）：直接调用onUp
        if (action === 'pause' || action === 'fire') {
          onUp(action);
        }
      }, { passive: false });

      btn.addEventListener('touchcancel', (e) => {
        e.preventDefault();
        btn.classList.remove('active');
        if (action === 'pause' || action === 'fire') {
          onUp(action);
        }
      }, { passive: false });

      btn.addEventListener('mousedown', () => {
        btn.classList.add('active');
        onDown(action);
      });

      btn.addEventListener('mouseup', () => {
        btn.classList.remove('active');
        onUp(action);
      });

      btn.addEventListener('mouseleave', () => {
        btn.classList.remove('active');
        onUp(action);
      });
    });

    // D-pad 滑动（支持多指触控：与开火按钮互不干扰）
    // 支持从按钮开始的连续滑动：手指按下UP按钮后，可以不离开滑到RIGHT按钮
    // 优化：方向切换去抖动 + 缓存rect避免重排 + 同步justPressed
    var dpad = container.querySelector('.dpad');
    var dpadRect = null;           // 缓存 D-Pad 矩形（避免每次 touchmove 重排）
    var currentDir = null;          // 当前方向（用于去抖动，避免频繁切换）
    var dpadCenter = { cx: 0, cy: 0 };
    var DPAD_THRESHOLD = 18;        // 启动阈值（位移超过此值才识别方向）
    var DPAD_DEAD_ZONE = 12;        // 中心死区（小于此距离不触发任何方向）
    var DPAD_SWITCH_RATIO = 1.25;   // 方向切换比例：主轴位移需为副轴的1.25倍以上才切换（磁滞效应）

    // 滑轮滑动日志系统：记录关键节点时间戳，用于排查延迟
    // 通过 window.__dpadLogs 访问日志数组，最多保留200条避免内存占用
    var dpadLogs = [];
    window.__dpadLogs = dpadLogs;
    var logStartTime = 0;
    var logPadStart = function(ts) {
      var s = String(ts);
      while (s.length < 7) s = '0' + s;  // 补零对齐
      return s;
    };
    var logDpad = function(event, data) {
      var now = performance.now();
      var ts = logStartTime > 0 ? now - logStartTime : 0;
      var entry = {
        t: Math.round(ts * 1000) / 1000,  // 毫秒，相对首次事件
        ts: Math.round(now * 1000) / 1000, // 绝对时间戳
        event: event,
        data: data || {}
      };
      dpadLogs.push(entry);
      if (dpadLogs.length > 200) dpadLogs.shift();  // 限制最多200条
      if (window.console && console.log) {
        console.log('[DPAD] +' + logPadStart(entry.t) + 'ms ' + event + (data ? ' ' + JSON.stringify(data) : ''));
      }
    };

    if (dpad) {
      // 根据触摸坐标计算方向（带磁滞效应，确保所有方向切换体验一致）
      // 核心策略：
      //   1. 死区内保持当前方向（滑动经过中心不丢失方向）
      //   2. 同方向直接保持（无需磁滞）
      //   3. 切换方向需主轴明显占优（主轴/副轴 > 1.25），避免对角线抖动
      //   4. 不满足切换条件时保持当前方向（实现平滑过渡）
      // prevDir: 当前方向，用于实现磁滞
      var calcDirection = function(clientX, clientY, prevDir) {
        var dx = clientX - dpadCenter.cx;
        var dy = clientY - dpadCenter.cy;
        var absDx = Math.abs(dx);
        var absDy = Math.abs(dy);

        // 1. 中心死区：保持当前方向（滑动经过中心点不切断移动）
        if (absDx < DPAD_DEAD_ZONE && absDy < DPAD_DEAD_ZONE) {
          return prevDir;
        }

        // 2. 计算候选方向（基于主轴）
        var isHorizontal = absDx > absDy;
        var candidate = isHorizontal
          ? (dx > 0 ? 'right' : 'left')
          : (dy > 0 ? 'down' : 'up');
        var majorAxis = isHorizontal ? absDx : absDy;
        var minorAxis = isHorizontal ? absDy : absDx;

        // 3. 候选方向与当前方向相同：直接保持（无需磁滞）
        if (candidate === prevDir) {
          return candidate;
        }

        // 4. 无当前方向（启动阶段）：使用普通阈值立即响应
        if (prevDir === null || prevDir === undefined) {
          if (majorAxis > DPAD_THRESHOLD) return candidate;
          return null;
        }

        // 5. 切换方向：需要主轴明显占优（磁滞效应，避免对角线附近抖动）
        //    例如从 UP 滑到 RIGHT 时，absDx 必须 > absDy * 1.25 才切换
        //    这保证了所有方向切换的"阻力"完全一致
        if (majorAxis > DPAD_THRESHOLD && majorAxis > minorAxis * DPAD_SWITCH_RATIO) {
          return candidate;
        }

        // 6. 不满足切换条件：保持当前方向（实现平滑过渡）
        return prevDir;
      };

      // 设置新方向（去抖动：只有方向变化时才更新）
      // 优化点：
      //   - 方向未变直接 return，避免不必要的 Set/DOM 操作
      //   - 同步触发 justPressed（音效等）
      //   - 视觉指示器与方向状态同步更新
      var setDirection = (newDir) => {
        if (newDir === currentDir) return;  // 方向未变，跳过（去抖动核心）
        var prevDir = currentDir;
        var switchTime = performance.now();
        // 清除旧方向
        if (currentDir) {
          this.pressed.delete(currentDir);
        }
        // 设置新方向
        if (newDir) {
          if (!this.pressed.has(newDir)) {
            this.justPressed.add(newDir);  // 同步触发 justPressed（音效等）
          }
          this.pressed.add(newDir);
        }
        currentDir = newDir;
        // 更新滑轮视觉指示器
        if (dpadWheel) {
          dpadWheel.classList.remove('up', 'down', 'left', 'right');
          if (newDir) dpadWheel.classList.add(newDir);
        }
        // 关键节点日志：方向切换
        logDpad('DIR_SWITCH', {
          from: prevDir || 'null',
          to: newDir || 'null',
          duration_ms: Math.round((performance.now() - switchTime) * 1000) / 1000
        });
      };

      dpad.addEventListener('touchstart', (e) => {
        // 初始化日志起始时间（首次触摸）
        if (logStartTime === 0) logStartTime = performance.now();
        var touchStart = performance.now();
        // 无论从哪里开始（按钮或滑轮），都进入滑动模式
        dpadTouchActive = true;
        dpadTouchId = e.changedTouches[0].identifier;
        if (dpadWheel) dpadWheel.classList.add('active');

        // 缓存 D-Pad 矩形（滑动期间不重复计算）
        var rectStart = performance.now();
        dpadRect = dpad.getBoundingClientRect();
        dpadCenter.cx = dpadRect.left + dpadRect.width / 2;
        dpadCenter.cy = dpadRect.top + dpadRect.height / 2;
        var rectEnd = performance.now();

        // 根据初始触摸位置设置方向（启动阶段：prevDir=null，使用普通阈值立即响应）
        var touch = e.changedTouches[0];
        var initDir = calcDirection(touch.clientX, touch.clientY, null);
        // 清除所有方向再设置（初始化）
        ['up', 'down', 'left', 'right'].forEach(a => this.pressed.delete(a));
        currentDir = null;
        setDirection(initDir);

        // 关键节点日志：触摸开始
        logDpad('TOUCHSTART', {
          id: dpadTouchId,
          x: Math.round(touch.clientX),
          y: Math.round(touch.clientY),
          initDir: initDir || 'null',
          rect_ms: Math.round((rectEnd - rectStart) * 1000) / 1000,
          total_ms: Math.round((performance.now() - touchStart) * 1000) / 1000
        });
      }, { passive: true });

      dpad.addEventListener('touchmove', (e) => {
        if (!dpadTouchActive) return;
        var moveStart = performance.now();
        e.preventDefault();
        // 通过 identifier 找到 D-Pad 上的触摸点（不受其他手指影响）
        var touch = null;
        for (var i = 0; i < e.touches.length; i++) {
          if (e.touches[i].identifier === dpadTouchId) {
            touch = e.touches[i];
            break;
          }
        }
        if (!touch) return;
        // 记录切换前的方向（用于日志判断方向是否变化）
        var prevDirBefore = currentDir;
        // 使用缓存的中心点计算方向（避免重排），传入 prevDir 实现磁滞效应
        var newDir = calcDirection(touch.clientX, touch.clientY, currentDir);
        var beforeSwitch = performance.now();
        setDirection(newDir);
        var afterSwitch = performance.now();

        // 关键节点日志：触摸移动（只在方向实际变化时记录，避免日志爆炸）
        // 注意：必须用切换前的 prevDirBefore 比较，因为 setDirection 内部会更新 currentDir
        if (newDir !== prevDirBefore) {
          logDpad('TOUCHMOVE', {
            x: Math.round(touch.clientX),
            y: Math.round(touch.clientY),
            prevDir: prevDirBefore || 'null',
            calcDir: newDir || 'null',
            switch_ms: Math.round((afterSwitch - beforeSwitch) * 1000) / 1000,
            total_ms: Math.round((afterSwitch - moveStart) * 1000) / 1000
          });
        }
      }, { passive: false });

      var endDpadTouch = (e) => {
        // 只有 D-Pad 上的手指离开才结束滑动
        if (dpadTouchId !== null) {
          var stillActive = false;
          for (var i = 0; i < e.touches.length; i++) {
            if (e.touches[i].identifier === dpadTouchId) {
              stillActive = true;
              break;
            }
          }
          if (!stillActive) {
            var endStart = performance.now();
            dpadTouchActive = false;
            dpadTouchId = null;
            ['up', 'down', 'left', 'right'].forEach(a => this.pressed.delete(a));
            var prevDir = currentDir;
            currentDir = null;
            // 清除滑轮激活和方向类
            if (dpadWheel) {
              dpadWheel.classList.remove('active', 'up', 'down', 'left', 'right');
            }
            // 关键节点日志：触摸结束
            logDpad('TOUCHEND', {
              prevDir: prevDir || 'null',
              total_ms: Math.round((performance.now() - endStart) * 1000) / 1000
            });
          }
        }
      };

      dpad.addEventListener('touchend', endDpadTouch);
      dpad.addEventListener('touchcancel', endDpadTouch);
    }
  }

  // 是否持续按下
  isDown(action) {
    return this.pressed.has(action);
  }

  // 本帧是否刚按下（消费后清除）
  wasPressed(action) {
    return this.justPressed.has(action);
  }

  // 帧末清除一次性状态
  endFrame() {
    this.justPressed.clear();
    this.mouseJustClicked = false;
  }

  // 获取鼠标坐标
  getMouse() {
    return { x: this.mouseX, y: this.mouseY, clicked: this.mouseJustClicked };
  }
}

// ===== 模块: core/Game.js =====
// Game 主控制器

// 按难度递增顺序：普通(Snow) → 困难(Jungle) → 噩梦(City) → 炼狱(Campus)
var MAP_DATAS = [MapData_Airport, MapData_Glacier, MapData_Desert, MapData_Space];
var ENEMY_SPAWN_POINTS = [
  { col: 0, row: 0 },
  { col: 12, row: 0 },
  { col: 25, row: 0 },
];

class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.state = GameState.MENU;
    this.lastTime = 0;
    this.gameTime = 0;

    // 子系统
    this.input = new InputManager(canvas);
    this.sound = new SoundManager();
    this.achievements = new AchievementManager();
    this.map = new Map();
    this.collision = new CollisionDetector(this.map);
    this.hud = new HUD();
    this.menu = new MenuScreen(this.achievements);
    this.result = new ResultScreen();
    this.base = new Base();

    // 成就解锁回调（右上角横幅 + 清脆声音）
    this.achievements.onUnlock((achievement) => {
      this.effects.spawn(EffectType.ACHIEVEMENT, 0, 0, {
        text: achievement.name,
        icon: achievement.icon,
        rarity: achievement.rarity,
      });
      this.sound.playAchievementUnlock();
    });

    // 对象池
    this.bulletPool = new ObjectPool(
      () => new Bullet(),
      (b) => b.reset(),
      POOL_BULLET_MAX
    );
    this.effectPool = new ObjectPool(
      () => new Effect(),
      (e) => e.reset(),
      POOL_EFFECT_MAX
    );

    // 游戏实体
    this.player = new PlayerTank();
    this.enemies = [];
    this.tanks = []; // 所有坦克（player + enemies）
    this.coins = [];  // 金币掉落
    this.props = [];  // 道具掉落
    this.artillery = new ArtilleryStrike();  // 炮弹雨轰炸
    this.artilleryTimer = 0;

    // 弹药通知
    this.ammoNotification = { text: '', timer: 0 };

    // 游戏数据
    this.currentMapIndex = 0;
    this.score = 0;
    this.scoreFlashTimer = 0;
    this.enemiesKilled = 0;
    this.enemySpawnQueue = [];
    this.enemySpawnIndex = 0;
    this.enemySpawnTimer = 0;
    this.lastEnemySpawnPoint = -1;

    // 本局统计（用于成就检查点）
    this.session = {
      playerDamaged: false,
      baseHit: false,
      playerFiredBullets: 0,
      combo3Reached: false,
      combo5Reached: false,
      combo10Reached: false,
      combo15Reached: false,
      combo20Reached: false,
      maxCombo: 0,
      hitCount: 0,
      heavyKills: 0,
      fastKills: 0,
      normalKills: 0,
      startTime: 0,
      scoreAtEnd: 0,
    };

    // 暂停菜单按钮悬浮状态
    this.pauseUI = {
      resumeHover: false,
      restartHover: false,
      exitHover: false,
      hudPauseHover: false,
    };

    // 基地摧毁延迟计时器（基地被击中后等待 1500ms 让爆炸特效播完再进入失败界面）
    this.baseDestroyDelay = 0;

    // 效果管理（包装 effects spawn）
    this.setupEffectManager();

    // 响应式画布缩放
    this._setupResponsiveCanvas();
  }

  _setupResponsiveCanvas() {
    // 精确检测移动设备：粗指针+无悬停 或 移动UA
    var isMobile = (() => {
      var coarseNoHover = window.matchMedia('(pointer: coarse) and (hover: none)').matches;
      var mobileUA = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      return coarseNoHover || mobileUA;
    })();

    // 移动设备显示虚拟按键
    var controls = document.getElementById('mobile-controls');
    if (controls && isMobile) {
      controls.classList.add('visible');
    }

    var resize = () => {
      var vw = window.innerWidth;
      var vh = window.innerHeight;
      var targetRatio = CANVAS_WIDTH / CANVAS_HEIGHT;
      var app = document.getElementById('app');
      var isPortraitMode = app && app.classList.contains('portrait-mode');

      var displayW, displayH;

      if (isMobile && isPortraitMode) {
        // 竖屏模式（不旋转）：移动键和开火键在画面下方水平排列
        var bottomPad = 210;  // 底部按键空间（dpad 180 + 上移12 + padding 18）
        var availW = vw - 4;
        var availH = vh - bottomPad;

        // 按完整显示 832×880 游戏画面的约束计算尺寸（无裁剪）
        var fitByWidthW = availW;
        var fitByWidthH = fitByWidthW / targetRatio;
        if (fitByWidthH > availH) {
          // 宽度占满时高度不够，改为按高度占满
          displayH = availH;
          displayW = displayH * targetRatio;
        } else {
          displayW = fitByWidthW;
          displayH = fitByWidthH;
        }
      } else {
        // PC端
        var windowRatio = vw / vh;
        if (windowRatio > targetRatio) {
          displayH = Math.min(vh - 20, CANVAS_HEIGHT);
          displayW = displayH * targetRatio;
        } else {
          displayW = Math.min(vw - 20, CANVAS_WIDTH);
          displayH = displayW / targetRatio;
        }
      }

      this.canvas.style.width = displayW + 'px';
      this.canvas.style.height = displayH + 'px';
    };

    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  }

  setupEffectManager() {
    var self = this;
    this.effects = {
      spawn(type, x, y, options) {
        var e = self.effectPool.acquire();
        e.init(type, x, y, options);
        return e;
      },
      getActive() {
        return self.effectPool.getActive();
      },
    };
  }

  start() {
    this.state = GameState.MENU;
    requestAnimationFrame(this.loop.bind(this));
  }

  loop(time) {
    var dt = Math.min(time - this.lastTime, 50);
    this.lastTime = time;

    this.update(dt);
    this.render();

    this.input.endFrame();
    requestAnimationFrame(this.loop.bind(this));
  }

  update(dt) {
    this.gameTime += dt;

    switch (this.state) {
      case GameState.MENU:
        this.menu.update(dt, this.input, (mapIndex) => {
          this.startGame(mapIndex);
        });
        break;
      case GameState.PLAYING:
        this.updatePlaying(dt);
        break;
      case GameState.PAUSED:
        this.updatePaused(dt);
        break;
      case GameState.WIN:
      case GameState.LOSE:
        this.result.update(dt, this.input, this.state, () => {
          this.state = GameState.MENU;
        });
        break;
    }
  }

  updatePaused(dt) {
    var mouse = this.input.getMouse();
    // 按钮布局：继续游戏(绿)、重新开始(黄)、退出(红) - 纵向排列
    var btnW = 240;
    var btnH = 52;
    var btnX = (CANVAS_WIDTH - btnW) / 2;
    var startY = CANVAS_HEIGHT / 2 - 10;
    var gap = 18;

    // 继续游戏
    var resumeY = startY;
    this.pauseUI.resumeHover = mouse.x >= btnX && mouse.x <= btnX + btnW &&
                                mouse.y >= resumeY && mouse.y <= resumeY + btnH;
    // 重新开始
    var restartY = startY + btnH + gap;
    this.pauseUI.restartHover = mouse.x >= btnX && mouse.x <= btnX + btnW &&
                                 mouse.y >= restartY && mouse.y <= restartY + btnH;
    // 退出
    var exitY = startY + (btnH + gap) * 2;
    this.pauseUI.exitHover = mouse.x >= btnX && mouse.x <= btnX + btnW &&
                              mouse.y >= exitY && mouse.y <= exitY + btnH;

    // ESC 或 回车 继续游戏
    if (this.input.wasPressed('pause') || this.input.wasPressed('confirm')) {
      this.state = GameState.PLAYING;
      this._resetPauseHover();
      return;
    }

    // 鼠标点击按钮
    if (mouse.clicked) {
      if (this.pauseUI.resumeHover) {
        this.state = GameState.PLAYING;
        this._resetPauseHover();
        return;
      }
      if (this.pauseUI.restartHover) {
        this._resetPauseHover();
        this.startGame(this.currentMapIndex);
        return;
      }
      if (this.pauseUI.exitHover) {
        this._resetPauseHover();
        this.state = GameState.MENU;
        return;
      }
    }
  }

  _resetPauseHover() {
    this.pauseUI.resumeHover = false;
    this.pauseUI.restartHover = false;
    this.pauseUI.exitHover = false;
  }

  startGame(mapIndex) {
    this.currentMapIndex = mapIndex;
    var mapData = MAP_DATAS[mapIndex];
    this.map.load(mapData);
    this.collision.setMap(this.map);
    this.base.reset();

    // 难度配置
    this.currentDifficulty = mapData.difficulty || 'normal';
    this.currentDifficultyLabel = mapData.difficultyLabel || '普通';
    this.killTarget = mapData.killTarget || 20;
    this.currentAggression = mapData.aggression || 0.30;
    // 敌人刷新速度：普通×1 / 困难×2 / 噩梦×4 / 炼狱×6（间隔反向÷倍率）
    var rate = SPAWN_RATE[this.currentDifficulty] || 1;
    this.currentSpawnCD = ENEMY_SPAWN_CD / rate;
    // 玩家HP按难度设置：普通3/困难4/噩梦5/炼狱6
    this.player.maxHp = DIFFICULTY_HP[this.currentDifficulty] || PLAYER_MAX_HP;

    // 重置玩家
    var px = 8 * TILE_SIZE;
    var py = 24 * TILE_SIZE + MAP_OFFSET_Y;
    this.player.init(px, py, Direction.UP);

    // 重置游戏数据
    this.score = 0;
    this.scoreFlashTimer = 0;
    this.enemiesKilled = 0;
    this.enemySpawnQueue = [...mapData.enemyTypes];
    this.enemySpawnIndex = 0;
    this.enemySpawnTimer = 0;
    this.enemies = [];
    this.coins = [];
    this.props = [];
    this.bulletPool.releaseAll();
    this.effectPool.releaseAll();
    this.artillery.reset();
    this.artilleryTimer = 0;
    this.ammoNotification = { text: '', timer: 0 };
    this.baseDestroyDelay = 0; // 重置基地摧毁延迟

    // 重置本局统计
    this.session = {
      playerDamaged: false,
      baseHit: false,
      playerFiredBullets: 0,
      combo10Reached: false,
      combo15Reached: false,
      combo20Reached: false,
      combo5Reached: false,
      combo3Reached: false,
      maxCombo: 0,
      scoreAtEnd: 0,
      startTime: this.gameTime,
      heavyKills: 0,
      fastKills: 0,
      normalKills: 0,
      hitCount: 0,
    };

    // 生成第一个敌人
    this.spawnEnemy();

    this.state = GameState.PLAYING;
  }

  updatePlaying(dt) {
    var mouse = this.input.getMouse();

    // HUD 暂停按钮 hover 检测
    this.pauseUI.hudPauseHover = isPauseButtonClicked(mouse.x, mouse.y);

    // 暂停：键盘 ESC/P 或 HUD 暂停按钮点击
    if (this.input.wasPressed('pause')) {
      this.state = GameState.PAUSED;
      return;
    }
    if (this.pauseUI.hudPauseHover && mouse.clicked) {
      this.state = GameState.PAUSED;
      this.pauseUI.hudPauseHover = false;
      return;
    }

    this.map.update(dt);

    // 更新 HUD 动画时间（COMBO 脉冲效果依赖 animTime）
    this.hud.update(dt);

    // 玩家连击超时检查
    this.player.checkComboTimeout(this.gameTime);

    // 更新玩家
    var allTanks = [this.player, ...this.enemies];
    var firedBullet = this.player.update(dt, this.map, allTanks, this.bulletPool, this.effects, this.input);
    if (firedBullet) {
      if (firedBullet === 'no_ammo') {
        this.ammoNotification = { text: '弹药耗尽！按R消耗金币换子弹', timer: AMMO_WARNING_DURATION };
      } else if (firedBullet === 'reload_full') {
        this.ammoNotification = { text: `消耗${COINS_FOR_FULL}枚金币，补充${COIN_AMMO_FULL}发子弹！`, timer: AMMO_WARNING_DURATION };
      } else if (firedBullet === 'reload_small') {
        this.ammoNotification = { text: `消耗1枚金币，补充${COIN_AMMO_SMALL}发子弹！`, timer: AMMO_WARNING_DURATION };
      } else if (firedBullet === 'reload_fail') {
        this.ammoNotification = { text: '金币不足！击杀敌人收集金币后按R换弹', timer: AMMO_WARNING_DURATION };
      } else {
        // 玩家开火音效
        this.sound.playFire();
        // 累计开火
        this.session.playerFiredBullets++;
        this.checkAchievementBullets();
      }
    }

    // 连击成就检查
    var combo = this.player.comboCount;
    if (combo > this.session.maxCombo) this.session.maxCombo = combo;
    if (combo >= 3 && !this.session.combo3Reached) {
      this.session.combo3Reached = true;
      this.achievements.unlock('combo_3');
    }
    if (combo >= 5 && !this.session.combo5Reached) {
      this.session.combo5Reached = true;
      this.achievements.unlock('combo_5');
      if (this.currentDifficulty === 'normal') this.achievements.unlock('normal_combo_5');
    }
    if (combo >= 10 && !this.session.combo10Reached) {
      this.session.combo10Reached = true;
      this.achievements.unlock('combo_10');
      if (this.currentDifficulty === 'hard') this.achievements.unlock('hard_combo_10');
      if (this.currentDifficulty === 'nightmare') this.achievements.unlock('nightmare_combo_10');
    }
    if (combo >= 15 && !this.session.combo15Reached) {
      this.session.combo15Reached = true;
      this.achievements.unlock('combo_15');
      if (this.currentDifficulty === 'nightmare') this.achievements.unlock('nightmare_combo_15');
      if (this.currentDifficulty === 'purgatory') this.achievements.unlock('purgatory_combo_15');
    }
    if (combo >= 20 && !this.session.combo20Reached) {
      this.session.combo20Reached = true;
      if (this.currentDifficulty === 'purgatory') this.achievements.unlock('purgatory_combo_20');
    }

    // 分数闪烁
    if (this.scoreFlashTimer > 0) this.scoreFlashTimer -= dt;

    // 更新敌人
    for (var enemy of this.enemies) {
      if (!enemy.alive) continue;
      var enemyBullet = enemy.update(dt, this.map, allTanks, this.bulletPool, this.effects, this.player);
    }

    // 更新子弹
    this.bulletPool.forEachActive((bullet) => {
      if (!bullet.alive) return;
      bullet.update(dt);
      this.handleBulletCollisions(bullet);
    });

    // 清理死亡敌人
    this.enemies = this.enemies.filter(e => e.alive);

    // 更新基地
    this.base.update(dt);
    if (!this.base.alive) {
      // 基地已被摧毁，等待爆炸特效播完（1500ms）再进入失败界面
      if (this.baseDestroyDelay > 0) {
        this.baseDestroyDelay -= dt;
        // 延迟期间继续更新特效（爆炸、屏幕震动），但不生成新敌人
        this.effectPool.forEachActive((e) => e.update(dt));
        this.cleanupPools();
        return;
      }
      // 延迟结束，进入失败界面
      this.triggerLose();
      return;
    }

    // 玩家死亡
    if (!this.player.alive) {
      this.triggerLose();
      return;
    }

    // 敌人生成
    this.updateEnemySpawn(dt);

    // 更新金币 + 玩家收集金币
    for (var i = this.coins.length - 1; i >= 0; i--) {
      var coin = this.coins[i];
      if (!coin.alive) { this.coins.splice(i, 1); continue; }
      coin.update(dt);
      // 检测玩家是否碰到金币
      var cb = coin.getBounds();
      if (cb.x < this.player.x + this.player.size &&
          cb.x + cb.w > this.player.x &&
          cb.y < this.player.y + this.player.size &&
          cb.y + cb.h > this.player.y) {
        this.player.coins++;
        coin.alive = false;
        this.coins.splice(i, 1);
        this.effects.spawn(EffectType.TEXT, coin.x, coin.y, { text: '金币+1' });
      }
    }

    // 更新道具 + 玩家收集道具
    for (var i = this.props.length - 1; i >= 0; i--) {
      var prop = this.props[i];
      if (!prop.alive) { this.props.splice(i, 1); continue; }
      prop.update(dt);
      var pb = prop.getBounds();
      if (pb.x < this.player.x + this.player.size &&
          pb.x + pb.w > this.player.x &&
          pb.y < this.player.y + this.player.size &&
          pb.y + pb.h > this.player.y) {
        this.applyPropEffect(prop);
        prop.alive = false;
        this.props.splice(i, 1);
      }
    }

    // 更新玩家道具效果计时
    this.player.updatePropEffects(dt);

    // 更新炮弹雨轰炸
    this.artilleryTimer += dt;
    if (this.artilleryTimer >= ARTILLERY_INTERVAL) {
      this.artilleryTimer = 0;
      // 随机选择轰炸区（避开基地和换弹区）
      var zoneRow, zoneCol;
      var safe = false;
      var attempts = 0;
      while (!safe && attempts < 20) {
        zoneRow = 2 + Math.floor(Math.random() * (MAP_ROWS - 6));
        zoneCol = 2 + Math.floor(Math.random() * (MAP_COLS - 6));
        safe = true;
        for (var rr = zoneRow; rr < zoneRow + ARTILLERY_ZONE_SIZE && safe; rr++) {
          for (var cc = zoneCol; cc < zoneCol + ARTILLERY_ZONE_SIZE && safe; cc++) {
            if (this.map.grid[rr][cc] === TileType.BASE) {
              safe = false;
            }
          }
        }
        attempts++;
      }
      this.artillery.trigger(
        zoneCol * TILE_SIZE,
        zoneRow * TILE_SIZE + MAP_OFFSET_Y,
        ARTILLERY_ZONE_SIZE * TILE_SIZE,
        ARTILLERY_ZONE_SIZE * TILE_SIZE
      );
    }
    this.artillery.update(dt, this.map, [this.player, ...this.enemies], this.effects);

    // 更新弹药通知计时器
    if (this.ammoNotification.timer > 0) {
      this.ammoNotification.timer -= dt;
    }

    // 更新特效
    this.effectPool.forEachActive((e) => e.update(dt));

    // 检查胜利
    if (this.enemiesKilled >= this.killTarget && this.enemies.length === 0) {
      this.triggerWin();
    }

    // 清理对象池
    this.cleanupPools();
  }

  handleBulletCollisions(bullet) {
    if (!bullet.alive) return;

    // 1. 子弹与瓦片
    var tileHit = this.collision.checkBulletTiles(bullet);
    if (tileHit.hit) {
      bullet.alive = false;
      if (tileHit.destructible) {
        this.map.setTile(tileHit.row, tileHit.col, TileType.EMPTY);
        this.effects.spawn(EffectType.EXPLOSION_SMALL, bullet.x, bullet.y);
      } else {
        this.effects.spawn(EffectType.EXPLOSION_SMALL, bullet.x, bullet.y);
      }
      return;
    }

    // 2. 子弹与基地
    var baseHit = this.collision.checkBulletBase(bullet, this.base);
    if (baseHit.hit) {
      bullet.alive = false;
      this.base.hit();
      this.session.baseHit = true; // 基地被命中
      // 基地爆炸特效持续 1500ms，与延迟进入失败界面同步
      this.effects.spawn(EffectType.EXPLOSION_LARGE, this.base.x + this.base.w / 2, this.base.y + this.base.h / 2, { duration: 1500 });
      this.effects.spawn(EffectType.SCREEN_SHAKE, 0, 0, { intensity: 14, duration: 800 });
      // 设置 1500ms 延迟，让爆炸特效完整播放后再进入失败界面
      this.baseDestroyDelay = 1500;
      return;
    }

    // 3. 子弹与坦克
    var allTanks = [this.player, ...this.enemies];
    var tankHit = this.collision.checkBulletTanks(bullet, allTanks);
    if (tankHit.hit) {
      bullet.alive = false;
      var tank = tankHit.tank;
      var isPlayer = tank.type === 'player';
      // 玩家子弹命中统计
      if (bullet.owner === 'player') this.session.hitCount++;

      if (isPlayer) {
        // 玩家受击
        var damaged = this.player.takeDamage(1, this.effects);
        if (damaged) {
          this.session.playerDamaged = true; // 玩家被打伤
          if (!this.player.alive) {
            this.effects.spawn(EffectType.EXPLOSION_LARGE, this.player.x + this.player.size / 2, this.player.y + this.player.size / 2);
          }
        }
      } else {
        // 敌人受击
        var damaged = tank.takeDamage(1);
        if (damaged && !tank.alive) {
          this.onEnemyKilled(tank);
          this.effects.spawn(EffectType.EXPLOSION_LARGE, tank.x + tank.size / 2, tank.y + tank.size / 2);
        } else if (damaged) {
          this.effects.spawn(EffectType.EXPLOSION_SMALL, bullet.x, bullet.y);
        }
      }
      return;
    }

    // 4. 子弹与子弹
    var bulletHit = this.collision.checkBulletBullets(bullet, this.bulletPool.getActive());
    if (bulletHit.hit) {
      bullet.alive = false;
      bulletHit.other.alive = false;
      this.effects.spawn(EffectType.EXPLOSION_SMALL, bullet.x, bullet.y);
      return;
    }
  }

  onEnemyKilled(enemy) {
    this.enemiesKilled++;
    var baseScore = ENEMY_SCORE[enemy.type] || 100;
    var finalScore = this.player.onKill(this.gameTime, baseScore, this.effects);
    this.score += finalScore;
    this.scoreFlashTimer = 150;

    // 按敌人类型统计
    if (enemy.type === 'enemy_heavy') this.session.heavyKills++;
    else if (enemy.type === 'enemy_fast') this.session.fastKills++;
    else this.session.normalKills++;

    // 敌人被击败爆炸音效
    this.sound.playExplosion();

    // 飘字
    this.effects.spawn(EffectType.TEXT, enemy.x + enemy.size / 2, enemy.y, { text: `+${finalScore}` });

    // 随机掉落：50%金币 / 30%道具 / 20%不掉落
    var roll = Math.random();
    var cx = enemy.x + enemy.size / 2;
    var cy = enemy.y + enemy.size / 2;
    if (roll < 0.5) {
      var coin = new Coin();
      coin.init(cx, cy);
      this.coins.push(coin);
    } else if (roll < 0.8) {
      var propTypes = [PropType.SPEED, PropType.SHIELD, PropType.AMMO];
      var propType = propTypes[Math.floor(Math.random() * propTypes.length)];
      var prop = new Prop();
      prop.init(cx, cy, propType);
      this.props.push(prop);
    }

    // 首杀
    this.achievements.unlock('first_kill');
    // 累计击杀成就
    this.checkAchievementKills();

    // 难度专属击杀成就
    if (this.currentDifficulty === 'normal' && this.session.heavyKills >= 3) {
      this.achievements.unlock('normal_heavy_hunter');
    }
    if (this.currentDifficulty === 'hard') {
      if (this.session.heavyKills >= 5) this.achievements.unlock('hard_heavy_hunter');
      if (this.session.fastKills >= 10) this.achievements.unlock('hard_fast_killer');
    }
    if (this.currentDifficulty === 'nightmare' && this.session.heavyKills >= 8) {
      this.achievements.unlock('nightmare_heavy_hunter');
    }
  }

  applyPropEffect(prop) {
    var cfg = PropConfig[prop.type];
    this.effects.spawn(EffectType.TEXT, prop.x, prop.y, { text: cfg.icon + ' ' + cfg.label });
    switch (prop.type) {
      case PropType.SPEED:
        this.player.propSpeedTimer = cfg.duration;
        break;
      case PropType.SHIELD:
        this.player.propShieldTimer = cfg.duration;
        break;
      case PropType.AMMO:
        this.player.ammo = Math.min(this.player.maxAmmo, this.player.ammo + 3);
        break;
    }
  }

  updateEnemySpawn(dt) {
    this.enemySpawnTimer += dt;
    var aliveEnemies = this.enemies.length;
    var remaining = this.killTarget - this.enemiesKilled - aliveEnemies;

    // 使用动态刷新间隔（受难度影响）
    var spawnCD = this.currentSpawnCD || ENEMY_SPAWN_CD;
    if (remaining > 0 && aliveEnemies < ENEMY_MAX_ONSCREEN && this.enemySpawnTimer >= spawnCD) {
      this.spawnEnemy();
      this.enemySpawnTimer = 0;
    }
  }

  spawnEnemy() {
    if (this.enemySpawnIndex >= this.enemySpawnQueue.length) return;

    // 轮换生成点
    var pointIdx = this.enemySpawnIndex % ENEMY_SPAWN_POINTS.length;
    var point = ENEMY_SPAWN_POINTS[pointIdx];
    var type = this.enemySpawnQueue[this.enemySpawnIndex];

    var enemy = new EnemyTank(type);
    enemy.setAggression(this.currentAggression);
    var x = point.col * TILE_SIZE;
    var y = point.row * TILE_SIZE + MAP_OFFSET_Y;
    enemy.init(x, y, Direction.DOWN);
    this.enemies.push(enemy);

    // 出生特效
    this.effects.spawn(EffectType.SPAWN, x + enemy.size / 2, y + enemy.size / 2);

    this.enemySpawnIndex++;
  }

  triggerWin() {
    this.state = GameState.WIN;
    var bonus = this.player.hp * WIN_BONUS_PER_HP;
    this.score += bonus;
    this.result.setStats({
      score: this.score,
      killed: this.enemiesKilled,
      hpLeft: this.player.hp,
      bonus,
      win: true,
      killTarget: this.killTarget,
    });

    var am = this.achievements;
    var diff = this.currentDifficulty;
    var elapsed = this.gameTime - this.session.startTime;
    var hitRate = this.session.playerFiredBullets > 0
      ? this.session.hitCount / this.session.playerFiredBullets : 0;

    // ===== 通用得分成就 =====
    if (this.score >= 5000) am.unlock('score_5000');
    if (this.score >= 10000) am.unlock('score_10000');
    if (this.score >= 20000) am.unlock('score_20000');
    if (this.score >= 30000) am.unlock('score_30000');

    // ===== 通用连击成就（跨难度） =====
    // 已在 updatePlaying 中实时检查

    // ===== 难度通关成就 =====
    // 注：不同难度玩家HP不同（普通3/困难4/噩梦5/炼狱6），使用 maxHp 动态判断
    var maxHp = this.player.maxHp;
    if (diff === 'normal') {
      am.unlock('normal_clear');
      if (this.player.hp >= maxHp && !this.session.playerDamaged) am.unlock('normal_flawless');
      if (this.player.hp >= maxHp && !this.session.playerDamaged) am.unlock('normal_no_damage');
      if (!this.session.baseHit) am.unlock('normal_base_guard');
      if (elapsed <= 180000) am.unlock('normal_speedrun'); // 3分钟
      // HP剩1时通关（逆风翻盘）：必然 playerDamaged，加检查以保持代码风格一致
      if (this.player.hp === 1 && this.session.playerDamaged) am.unlock('normal_comeback');
      if (hitRate >= 0.8 && this.session.playerFiredBullets >= 20) am.unlock('normal_precision');
    }
    if (diff === 'hard') {
      am.unlock('hard_clear');
      if (this.player.hp >= maxHp && !this.session.playerDamaged) am.unlock('hard_flawless');
      if (!this.session.baseHit) am.unlock('hard_base_guard');
      // 仅受1次伤害通关：起始HP=maxHp，受1次伤后HP=maxHp-1
      if (this.player.hp === maxHp - 1 && this.session.playerDamaged) am.unlock('hard_low_damage');
      if (this.player.hp >= maxHp - 2) am.unlock('hard_survivor');
      if (hitRate >= 0.8 && this.session.playerFiredBullets >= 30) am.unlock('hard_precision');
      if (this.score >= 15000) am.unlock('hard_score_15000');
    }
    if (diff === 'nightmare') {
      am.unlock('nightmare_clear');
      if (this.player.hp >= maxHp && !this.session.playerDamaged) am.unlock('nightmare_flawless');
      if (!this.session.baseHit) am.unlock('nightmare_base_guard');
      if (this.player.hp >= maxHp - 2) am.unlock('nightmare_survivor');
      // 仅受1次伤害通关：起始HP=maxHp，受1次伤后HP=maxHp-1
      if (this.player.hp === maxHp - 1 && this.session.playerDamaged) am.unlock('nightmare_low_damage');
      if (this.score >= 25000) am.unlock('nightmare_score_25000');
    }
    if (diff === 'purgatory') {
      am.unlock('purgatory_clear');
      if (this.player.hp >= maxHp && !this.session.playerDamaged) am.unlock('purgatory_flawless');
      if (this.player.hp >= maxHp && !this.session.playerDamaged) am.unlock('purgatory_no_damage');
      if (!this.session.baseHit) am.unlock('purgatory_base_guard');
      if (this.player.hp >= maxHp - 2) am.unlock('purgatory_survivor');
      // 仅受1次伤害通关：起始HP=maxHp，受1次伤后HP=maxHp-1
      if (this.player.hp === maxHp - 1 && this.session.playerDamaged) am.unlock('purgatory_low_damage');
      // HP剩1时通关（逆风翻盘）：必然 playerDamaged，加检查以保持代码风格一致
      if (this.player.hp === 1 && this.session.playerDamaged) am.unlock('purgatory_comeback');
      // 8分钟内通关（炼狱要杀80个，时间放宽）
      if (elapsed <= 480000) am.unlock('purgatory_speedrun');
      // 命中率≥85%
      if (hitRate >= 0.85 && this.session.playerFiredBullets >= 40) am.unlock('purgatory_precision');
      if (this.score >= 40000) am.unlock('purgatory_score_40000');
      if (this.session.heavyKills >= 12) am.unlock('purgatory_heavy_hunter');
      if (this.session.fastKills >= 20) am.unlock('purgatory_fast_killer');
      // 全部击杀80辆
      if (this.enemiesKilled >= 80) am.unlock('purgatory_all_kill');
    }

    // ===== 全难度征服 =====
    this.markDifficultyCleared(diff);
    this.checkAllDifficultyCleared();

    // 累计局数
    this.incrSessionCount();
  }

  triggerLose() {
    this.state = GameState.LOSE;
    this.result.setStats({
      score: this.score,
      killed: this.enemiesKilled,
      hpLeft: this.player.hp, // 使用玩家实际HP：0=坦克被摧毁，>0=基地被摧毁
      bonus: 0,
      win: false,
      killTarget: this.killTarget,
    });
    this.incrSessionCount();
  }

  // ===== 成就累计统计（独立 localStorage 键）=====
  _getCounter(key, def = 0) {
    try {
      var v = parseInt(localStorage.getItem(key), 10);
      return isNaN(v) ? def : v;
    } catch (e) { return def; }
  }
  _setCounter(key, val) {
    try { localStorage.setItem(key, String(val)); } catch (e) {}
  }

  incrSessionCount() {
    var key = 'nyh_tank_sessions_total';
    var n = this._getCounter(key, 0) + 1;
    this._setCounter(key, n);
    if (n >= 1) this.achievements.unlock('first_game');
    if (n >= 10) this.achievements.unlock('veteran_10');
    if (n >= 50) this.achievements.unlock('veteran_50');
  }

  checkAchievementKills() {
    var key = 'nyh_tank_kills_total';
    var n = this._getCounter(key, 0) + 1;
    this._setCounter(key, n);
    if (n >= 50) this.achievements.unlock('kill_50');
    if (n >= 100) this.achievements.unlock('kill_100');
    if (n >= 200) this.achievements.unlock('kill_200');
    if (n >= 500) this.achievements.unlock('kill_500');
    if (n >= 1000) this.achievements.unlock('kill_1000');
  }

  checkAchievementBullets() {
    var key = 'nyh_tank_bullets_total';
    var n = this._getCounter(key, 0) + 1;
    this._setCounter(key, n);
    if (n >= 100) this.achievements.unlock('bullet_100');
    if (n >= 500) this.achievements.unlock('bullet_500');
    if (n >= 1000) this.achievements.unlock('bullet_1000');
    if (n >= 2000) this.achievements.unlock('bullet_2000');
  }

  markDifficultyCleared(diff) {
    var key = 'nyh_tank_diff_cleared';
    try {
      var arr = JSON.parse(localStorage.getItem(key) || '[]');
      if (!arr.includes(diff)) {
        arr.push(diff);
        localStorage.setItem(key, JSON.stringify(arr));
      }
    } catch (e) {}
  }

  checkAllDifficultyCleared() {
    try {
      var key = 'nyh_tank_diff_cleared';
      var arr = JSON.parse(localStorage.getItem(key) || '[]');
      if (arr.length >= 4) this.achievements.unlock('all_difficulty_clear');
    } catch (e) {}
  }

  cleanupPools() {
    // 释放已死亡的子弹
    var bullets = this.bulletPool.getActive();
    for (var i = bullets.length - 1; i >= 0; i--) {
      if (!bullets[i].alive) {
        this.bulletPool.release(bullets[i]);
      }
    }
    // 释放已结束的特效
    var effects = this.effectPool.getActive();
    for (var i = effects.length - 1; i >= 0; i--) {
      if (!effects[i].alive) {
        this.effectPool.release(effects[i]);
      }
    }
  }

  render() {
    var ctx = this.ctx;
    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    // 背景渐变
    this.renderBackground(ctx);

    switch (this.state) {
      case GameState.MENU:
        this.menu.render(ctx, this.input);
        break;
      case GameState.PLAYING:
      case GameState.PAUSED:
        this.renderGame(ctx);
        if (this.state === GameState.PAUSED) {
          this.renderPauseOverlay(ctx);
        }
        break;
      case GameState.WIN:
      case GameState.LOSE:
        this.renderGame(ctx);
        this.result.render(ctx, this.input);
        break;
    }
  }

  renderBackground(ctx) {
    if (this.state === GameState.MENU) {
      var grad = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
      grad.addColorStop(0, '#1a1730');
      grad.addColorStop(0.5, '#2a2640');
      grad.addColorStop(1, '#1a1730');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    } else {
      var c = this.map.colors;
      var grad = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
      grad.addColorStop(0, c.background[0]);
      grad.addColorStop(1, c.background[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    }
  }

  renderGame(ctx) {
    // 屏幕震动
    var shakeX = 0, shakeY = 0;
    for (var e of this.effectPool.getActive()) {
      if (e.type === EffectType.SCREEN_SHAKE && e.alive) {
        var off = e.getShakeOffset();
        shakeX += off.dx;
        shakeY += off.dy;
      }
    }

    ctx.save();
    ctx.translate(shakeX, shakeY);

    // Layer 0: 地图背景
    this.map.renderBackground(ctx);

    // Layer 0.5: 地图下层（砖墙/钢墙/水域）
    this.map.renderBottom(ctx);

    // Layer 0.8: 基地（城堡造型，在地图瓦片之上、坦克之下渲染）
    this.base.render(ctx, this.map.colors);

    // Layer 1: 坦克
    this.player.render(ctx);
    for (var enemy of this.enemies) {
      enemy.render(ctx);
    }

    // Layer 2: 子弹
    this.bulletPool.forEachActive((b) => b.render(ctx));

    // Layer 3: 草丛（上层）
    this.map.renderTop(ctx);

    // Layer 4: 特效
    this.effectPool.forEachActive((e) => e.render(ctx));

    // Layer 4.5: 金币
    for (var coin of this.coins) {
      coin.render(ctx);
    }

    // Layer 4.55: 道具
    for (var prop of this.props) {
      prop.render(ctx);
    }

    // Layer 4.6: 炮弹雨
    this.artillery.render(ctx, 0);

    ctx.restore();

    // 弹药通知（屏幕中央，不受震动影响）
    if (this.ammoNotification.timer > 0) {
      var alpha = Math.min(1, this.ammoNotification.timer / 500);
      var notifW = 400, notifH = 50;
      var notifX = (CANVAS_WIDTH - notifW) / 2;
      var notifY = CANVAS_HEIGHT / 2 - notifH / 2;
      fillStrokeRoundRect(ctx, notifX, notifY, notifW, notifH, 12,
        'rgba(26, 23, 48, ' + (0.95 * alpha) + ')',
        'rgba(255, 215, 110, ' + (0.6 * alpha) + ')', 2);
      drawText(ctx, this.ammoNotification.text, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, {
        font: 'bold 16px sans-serif',
        color: 'rgba(255, 215, 110, ' + alpha + ')',
        align: 'center',
        baseline: 'middle',
      });
    }

    // Layer 5: HUD（不受震动影响）
    this.hud.render(ctx, {
      hp: this.player.hp,
      maxHp: this.player.maxHp,
      score: this.score,
      enemyCount: this.enemies.length,
      killed: this.enemiesKilled,
      total: this.killTarget,
      combo: this.player.comboCount,
      scoreFlash: this.scoreFlashTimer > 0,
      hpFlash: this.player.invincible && this.player.invincibleTimer > 0,
      colors: this.map.colors,
      difficultyLabel: this.currentDifficultyLabel,
      pauseHover: this.pauseUI.hudPauseHover,
      ammo: this.player.ammo,
      maxAmmo: this.player.maxAmmo,
      coins: this.player.coins,
      propSpeedTimer: this.player.propSpeedTimer,
      propShieldTimer: this.player.propShieldTimer,
    });
  }

  renderPauseOverlay(ctx) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    // 标题：已暂停
    var titleY = CANVAS_HEIGHT / 2 - 80;
    ctx.fillStyle = '#FFD76E';
    ctx.font = 'bold 48px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(255, 215, 110, 0.5)';
    ctx.shadowBlur = 16;
    ctx.fillText('已暂停', CANVAS_WIDTH / 2, titleY);
    ctx.shadowBlur = 0;

    // 三个按钮：继续游戏、重新开始、退出
    var btnW = 240;
    var btnH = 52;
    var btnX = (CANVAS_WIDTH - btnW) / 2;
    var startY = CANVAS_HEIGHT / 2 - 10;
    var gap = 18;
    var ui = this.pauseUI;

    // ===== 按钮 1：继续游戏（蓝绿）=====
    var resumeY = startY;
    this._drawPauseBtn(ctx, btnX, resumeY, btnW, btnH,
      '▶ 继续游戏', '#5CC8FF', ui.resumeHover, 'rgba(92, 200, 255, 0.35)');

    // ===== 按钮 2：重新开始（金黄）=====
    var restartY = startY + btnH + gap;
    this._drawPauseBtn(ctx, btnX, restartY, btnW, btnH,
      '⟳ 重新开始', '#FFD76E', ui.restartHover, 'rgba(255, 215, 110, 0.35)');

    // ===== 按钮 3：退出到主菜单（红）=====
    var exitY = startY + (btnH + gap) * 2;
    this._drawPauseBtn(ctx, btnX, exitY, btnW, btnH,
      '✕ 退出到主菜单', '#FF6B6B', ui.exitHover, 'rgba(255, 107, 107, 0.35)');

    // 提示
    drawText(ctx, 'ESC 或 回车 = 继续游戏', CANVAS_WIDTH / 2, exitY + btnH + 28, {
      font: '13px sans-serif',
      color: 'rgba(194, 163, 255, 0.6)',
      align: 'center',
      baseline: 'middle',
    });
  }

  _drawPauseBtn(ctx, x, y, w, h, label, baseColor, hovered, glowRgba) {
    fillStrokeRoundRect(ctx, x, y, w, h, 12,
      hovered ? glowRgba : 'rgba(42, 38, 64, 0.7)',
      hovered ? baseColor : 'rgba(194, 163, 255, 0.6)',
      hovered ? 2.5 : 1.5);
    drawText(ctx, label, x + w / 2, y + h / 2, {
      font: 'bold 18px sans-serif',
      color: hovered ? baseColor : '#FFFFFF',
      align: 'center',
      baseline: 'middle',
      shadow: hovered ? { color: baseColor, blur: 10 } : null,
    });
  }
}

// 主入口

try {
  var canvas = document.getElementById('game');
  var loading = document.getElementById('loading');

  if (canvas) {
    var game = new Game(canvas);
    game.start();
    window.gameInstance = game;
    if (loading) {
      loading.classList.add('hidden');
      setTimeout(() => loading.remove(), 300);
    }
  }
} catch (e) {
  console.error('[ERROR] Game initialization failed:', e);
  var loading = document.getElementById('loading');
  if (loading) {
    loading.textContent = '加载失败: ' + e.message;
    loading.style.color = '#FF6B6B';
    loading.style.fontSize = '16px';
  }
}

})();

  <script>
    // 竖屏检测与适配
    (function() {
      var app = document.getElementById('app');
      var mobileControls = document.getElementById('mobile-controls');
      
      function isMobileDevice() {
        return /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
          || (window.innerWidth < 768 && 'ontouchstart' in window);
      }
      
      function triggerResize() {
        // 触发游戏画布resize
        if (window.gameInstance) {
          var event = new Event('resize');
          window.dispatchEvent(event);
        }
      }
      
      function checkOrientation() {
        if (!isMobileDevice()) {
          app.classList.remove('portrait-mode');
          if (mobileControls) mobileControls.classList.remove('visible');
          return;
        }
        // 移动端统一使用竖屏模式（不旋转），按键在画面下方
        var wasPortrait = app.classList.contains('portrait-mode');
        app.classList.add('portrait-mode');
        if (mobileControls) mobileControls.classList.add('visible');

        // 首次进入移动端时触发resize
        if (!wasPortrait) {
          setTimeout(triggerResize, 50);
          setTimeout(triggerResize, 300);
        }
      }
      
      function delayedCheck() {
        checkOrientation();
        setTimeout(checkOrientation, 100);
        setTimeout(checkOrientation, 300);
        setTimeout(checkOrientation, 500);
      }
      
      window.addEventListener('resize', delayedCheck);
      window.addEventListener('orientationchange', delayedCheck);
      window.addEventListener('load', delayedCheck);
      checkOrientation();
    })();
  </script>
