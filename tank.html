<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Tank Battle</title>
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: linear-gradient(135deg, #1a1730 0%, #2a2640 50%, #1a1730 100%);
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #e8e6f0;
  touch-action: none;
  overscroll-behavior: none;
}

#app {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  overflow: hidden;
}

/* 游戏容器包裹canvas和loading */
#game-container {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 竖屏模式：画面顶部对齐，给底部按键预留空间 */
#app.portrait-mode {
  align-items: flex-start;
  padding-top: 4px;
}

/* 竖屏模式：虚拟按键在画面下方水平排列（移动键在左，开火键在右） */
#app.portrait-mode #mobile-controls {
  position: fixed;
  top: auto;
  bottom: 0;
  left: 0;
  right: 0;
  flex-direction: row;
  justify-content: space-between;
  align-items: center;
  padding: 8px 14px 14px;
  pointer-events: none;
  z-index: 100;
}

/* 竖屏模式：方向键正常显示（不旋转），向右上偏移 */
#app.portrait-mode .dpad {
  pointer-events: auto;
  transform: translate(8px, -12px);
}

/* 竖屏模式：开火键区域（水平排列：暂停在左，开火在右） */
#app.portrait-mode .fire-area {
  flex-direction: row;
  gap: 10px;
  pointer-events: auto;
  align-items: center;
}

/* 竖屏模式：放大方向键至 180×180（与开火键整体高度一致） */
#app.portrait-mode .dpad {
  width: 180px;
  height: 180px;
}

#app.portrait-mode .dpad-btn {
  width: 58px;
  height: 58px;
  font-size: 24px;
}

#app.portrait-mode .dpad-center {
  width: 58px;
  height: 58px;
}

/* 竖屏模式：开火键和暂停键整体高度与方向键一致（180px） */
#app.portrait-mode .fire-btn {
  width: 110px;
  height: 110px;
  font-size: 32px;
}

#app.portrait-mode .pause-btn {
  width: 56px;
  height: 56px;
  font-size: 20px;
}

#app.portrait-mode .fire-area {
  height: 180px;
  align-items: center;
}

#game {
  background: #0e0c1f;
  border: 2px solid rgba(194, 163, 255, 0.3);
  border-radius: 8px;
  box-shadow:
    0 0 40px rgba(194, 163, 255, 0.15),
    0 0 80px rgba(124, 196, 255, 0.08);
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  max-width: 100%;
  max-height: 100%;
  touch-action: none;
}

#loading {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 24px;
  color: #FFD76E;
  text-shadow: 0 0 12px rgba(255, 215, 110, 0.5);
  z-index: 10;
  transition: opacity 0.3s;
}

#loading.hidden {
  opacity: 0;
  pointer-events: none;
}

/* ========== 虚拟按键（移动端） ========== */
#mobile-controls {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 10px 16px 20px;
  z-index: 100;
  pointer-events: none;
  justify-content: space-between;
  align-items: flex-end;
}

/* 由 JS 通过触控检测添加 .visible 类 */
#mobile-controls.visible {
  display: flex;
}

/* 方向键 */
.dpad {
  width: 160px;
  height: 160px;
  position: relative;
  pointer-events: auto;
}

.dpad-btn {
  position: absolute;
  width: 52px;
  height: 52px;
  background: rgba(124, 196, 255, 0.18);
  border: 2px solid rgba(124, 196, 255, 0.5);
  border-radius: 12px;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #7CC4FF;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
  backdrop-filter: blur(6px);
  transition: all 0.08s ease;
}

.dpad-btn:active,
.dpad-btn.active {
  background: rgba(255, 215, 110, 0.45);
  border-color: #FFD76E;
  color: #FFD76E;
  transform: scale(0.92);
  box-shadow: 0 0 16px rgba(255, 215, 110, 0.4);
}

.dpad-up    { top: 0;    left: 50%; transform: translateX(-50%); }
.dpad-down  { bottom: 0; left: 50%; transform: translateX(-50%); }
.dpad-left  { left: 0;   top: 50%; transform: translateY(-50%); }
.dpad-right { right: 0;  top: 50%; transform: translateY(-50%); }

.dpad-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 52px; height: 52px;
  background: rgba(194, 163, 255, 0.12);
  border-radius: 8px;
}

/* 滑轮：位于方向键中心，可在其上滑动控制方向 */
.dpad-wheel {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 80%;
  height: 80%;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(124, 196, 255, 0.20), rgba(124, 196, 255, 0.05));
  border: 2px solid rgba(124, 196, 255, 0.35);
  pointer-events: none;
  z-index: 0;
  backdrop-filter: blur(4px);
  transition: background 0.12s ease, border-color 0.12s ease;
}

/* 滑轮中心小圆点，显示触摸位置 */
.dpad-wheel::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: rgba(255, 215, 110, 0.7);
  box-shadow: 0 0 12px rgba(255, 215, 110, 0.5);
  transition: transform 0.04s ease-out;  /* 缩短过渡时间，减少视觉延迟 */
  pointer-events: none;
}

/* 滑轮激活态 */
.dpad-wheel.active {
  background: radial-gradient(circle at 35% 30%, rgba(255, 215, 110, 0.30), rgba(255, 215, 110, 0.08));
  border-color: rgba(255, 215, 110, 0.6);
}

/* 滑轮触摸点指示器位置随滑动方向偏移（用 !important 确保覆盖基础 transform） */
.dpad-wheel.up::after    { transform: translate(-50%, -200%) !important; }
.dpad-wheel.down::after  { transform: translate(-50%, 100%) !important; }
.dpad-wheel.left::after  { transform: translate(-200%, -50%) !important; }
.dpad-wheel.right::after { transform: translate(100%, -50%) !important; }

/* 开火按钮 */
.fire-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  pointer-events: auto;
}

.fire-btn {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #FF6B6B, #CC3333);
  border: 3px solid rgba(255, 215, 110, 0.7);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
  font-size: 28px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(255, 107, 107, 0.4),
              inset 0 -4px 8px rgba(0, 0, 0, 0.3);
  transition: all 0.08s ease;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
}

.fire-btn:active,
.fire-btn.active {
  transform: scale(0.9);
  box-shadow: 0 0 30px rgba(255, 107, 107, 0.7),
              inset 0 -2px 4px rgba(0, 0, 0, 0.4);
}

.pause-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(194, 163, 255, 0.2);
  border: 2px solid rgba(194, 163, 255, 0.5);
  color: #C2A3FF;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
}

.pause-btn:active {
  background: rgba(255, 215, 110, 0.4);
  border-color: #FFD76E;
}

/* ========== 响应式适配 ========== */

/* 小屏手机（竖屏）- 按键尺寸调整 */
@media (max-width: 500px) {
  #game {
    border-radius: 4px;
    border-width: 1px;
  }

  #app.portrait-mode .dpad {
    width: 150px;
    height: 150px;
  }

  #app.portrait-mode .dpad-btn {
    width: 50px;
    height: 50px;
    font-size: 18px;
  }

  #app.portrait-mode .dpad-center {
    width: 50px;
    height: 50px;
  }

  #app.portrait-mode .fire-btn {
    width: 92px;
    height: 92px;
    font-size: 26px;
  }

  #app.portrait-mode .pause-btn {
    width: 48px;
    height: 48px;
    font-size: 17px;
  }

  #app.portrait-mode .fire-area {
    height: 150px;
  }
}

/* 中等屏幕竖屏 - 按键尺寸调整 */
@media (min-width: 501px) and (max-width: 768px) {
  #app.portrait-mode .dpad {
    width: 170px;
    height: 170px;
  }

  #app.portrait-mode .dpad-btn {
    width: 56px;
    height: 56px;
    font-size: 20px;
  }

  #app.portrait-mode .dpad-center {
    width: 56px;
    height: 56px;
  }

  #app.portrait-mode .fire-btn {
    width: 104px;
    height: 104px;
    font-size: 30px;
  }

  #app.portrait-mode .pause-btn {
    width: 54px;
    height: 54px;
    font-size: 19px;
  }

  #app.portrait-mode .fire-area {
    height: 170px;
  }
}

  </style>
</head>
<body>

    <div id="game-container">
      <canvas id="game" width="832" height="880"></canvas>

// ===== 模块: config/ColorConfig.js =====

// ===== 模块: config/KeyConfig.js =====
// 按键绑定配置

// 反向映射：keyCode → action

// ===== 模块: utils/MathUtils.js =====
// 数学与几何工具函数

// 矩形碰撞检测（AABB）
function rectIntersect(a, b) {
  return a.x < b.x + b.w &&
         a.x + a.w > b.x &&
         a.y < b.y + b.h &&
         a.y + a.h > b.y;
}

// 点是否在矩形内
function pointInRect(px, py, rect) {
  return px >= rect.x && px <= rect.x + rect.w &&
         py >= rect.y && py <= rect.y + rect.h;
}

// 随机整数 [min, max]
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// 随机浮点 [min, max)
function randFloat(min, max) {
  return Math.random() * (max - min) + min;
}

// 数组随机取一项
function randPick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

// 限制范围
function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

// 距离平方（避免开方提升性能）
function distSq(x1, y1, x2, y2) {
  var dx = x2 - x1;
  var dy = y2 - y1;
  return dx * dx + dy * dy;
}

// 两点距离
function distance(x1, y1, x2, y2) {
  return Math.sqrt(distSq(x1, y1, x2, y2));
}

// 曼哈顿距离
function manhattan(x1, y1, x2, y2) {
  return Math.abs(x2 - x1) + Math.abs(y2 - y1);
}

// 线性插值
function lerp(a, b, t) {
  return a + (b - a) * t;
}

// 缓动函数（easeOutQuad）
function easeOutQuad(t) {
  return t * (2 - t);
}

// 角度转弧度
function degToRad(deg) {
  return deg * Math.PI / 180;
}

// Canvas 绘制辅助函数

// 绘制圆角矩形
function roundRect(ctx, x, y, w, h, r) {
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// 绘制带描边的填充矩形
function fillStrokeRect(ctx, x, y, w, h, fillColor, strokeColor, strokeWidth = 1) {
  ctx.fillStyle = fillColor;
  ctx.fillRect(x, y, w, h);
  if (strokeColor) {
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = strokeWidth;
    ctx.strokeRect(x, y, w, h);
  }
}

// 绘制带描边的圆角矩形
function fillStrokeRoundRect(ctx, x, y, w, h, r, fillColor, strokeColor, strokeWidth = 1) {
  roundRect(ctx, x, y, w, h, r);
  if (fillColor) {
    ctx.fillStyle = fillColor;
    ctx.fill();
  }
  if (strokeColor) {
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = strokeWidth;
    ctx.stroke();
  }
}

// 根据方向获取旋转角度（弧度）
function directionToAngle(dir) {
  switch (dir) {
    case Direction.UP: return 0;
    case Direction.RIGHT: return Math.PI / 2;
    case Direction.DOWN: return Math.PI;
    case Direction.LEFT: return -Math.PI / 2;
    default: return 0;
  }
}

// 在指定中心点绘制旋转的图形（回调式）
function drawRotated(ctx, cx, cy, angle, drawFn) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  drawFn(ctx);
  ctx.restore();
}

// 绘制五角星
function drawStar(ctx, cx, cy, spikes, outerR, innerR, fillColor, strokeColor) {
  var rot = -Math.PI / 2;
  var step = Math.PI / spikes;
  ctx.beginPath();
  ctx.moveTo(cx, cy - outerR);
  for (var i = 0; i < spikes; i++) {
    var x = cx + Math.cos(rot) * outerR;
    var y = cy + Math.sin(rot) * outerR;
    ctx.lineTo(x, y);
    rot += step;
    x = cx + Math.cos(rot) * innerR;
    y = cy + Math.sin(rot) * innerR;
    ctx.lineTo(x, y);
    rot += step;
  }
  ctx.lineTo(cx, cy - outerR);
  ctx.closePath();
  if (fillColor) {
    ctx.fillStyle = fillColor;
    ctx.fill();
  }
  if (strokeColor) {
    ctx.strokeStyle = strokeColor;
    ctx.stroke();
  }
}

// 绘制盾牌造型（用于基地）
function drawShield(ctx, cx, cy, size, fillColor, strokeColor) {
  ctx.beginPath();
  ctx.moveTo(cx, cy - size);
  ctx.lineTo(cx + size * 0.8, cy - size * 0.6);
  ctx.lineTo(cx + size * 0.8, cy + size * 0.3);
  ctx.quadraticCurveTo(cx + size * 0.8, cy + size, cx, cy + size);
  ctx.quadraticCurveTo(cx - size * 0.8, cy + size, cx - size * 0.8, cy + size * 0.3);
  ctx.lineTo(cx - size * 0.8, cy - size * 0.6);
  ctx.closePath();
  if (fillColor) {
    ctx.fillStyle = fillColor;
    ctx.fill();
  }
  if (strokeColor) {
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

// 绘制带阴影的文字
function drawText(ctx, text, x, y, options = {}) {
  var {
    font = '16px sans-serif',
    color = '#fff',
    align = 'left',
    baseline = 'top',
    stroke = null,
    strokeWidth = 2,
    shadow = null,
  } = options;

  ctx.font = font;
  ctx.textAlign = align;
  ctx.textBaseline = baseline;

  if (shadow) {
    ctx.shadowColor = shadow.color || 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = shadow.blur || 4;
    ctx.shadowOffsetX = shadow.offsetX || 0;
    ctx.shadowOffsetY = shadow.offsetY || 2;
  }

  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = strokeWidth;
    ctx.strokeText(text, x, y);
  }

  ctx.fillStyle = color;
  ctx.fillText(text, x, y);

  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;
}

// SoundManager 音效管理器（使用 Web Audio API 合成音效，无需外部音频文件）
class SoundManager {
  constructor() {
    this.ctx = null;
    this.enabled = true;
  }

  // 延迟初始化 AudioContext（浏览器要求用户交互后才能创建）
  init() {
    if (!this.ctx) {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      } catch (e) {
        this.enabled = false;
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  // 玩家开火音效：短促的"砰"声
  playFire() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;

    var now = this.ctx.currentTime;
    var osc = this.ctx.createOscillator();
    var gain = this.ctx.createGain();

    osc.type = 'square';
    osc.frequency.setValueAtTime(500, now);
    osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);

    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

    osc.connect(gain);
    gain.connect(this.ctx.destination);

    osc.start(now);
    osc.stop(now + 0.08);
  }

  // 敌人被击败音效：爆炸声
  playExplosion() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;

    var now = this.ctx.currentTime;

    // 白噪声模拟爆炸
    var duration = 0.35;
    var bufferSize = Math.floor(this.ctx.sampleRate * duration);
    var buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) {
      var decay = Math.pow(1 - i / bufferSize, 2);
      data[i] = (Math.random() * 2 - 1) * decay;
    }

    var noise = this.ctx.createBufferSource();
    noise.buffer = buffer;

    var filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1200, now);
    filter.frequency.exponentialRampToValueAtTime(80, now + duration);

    var gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);

    noise.start(now);
    noise.stop(now + duration);
  }

  // 成就解锁音效：清脆"叮叮叮"上行三音
  playAchievementUnlock() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;

    var now = this.ctx.currentTime;
    var notes = [
      { freq: 660, offset: 0 },
      { freq: 880, offset: 0.08 },
      { freq: 1320, offset: 0.16 },
    ];
    for (var note of notes) {
      var t = now + note.offset;
      var osc = this.ctx.createOscillator();
      var gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(note.freq, t);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.15, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.3);
    }
  }
}

// 快速查找表
var ACHIEVEMENT_MAP = {};
for (var a of ACHIEVEMENT_LIST) {
  ACHIEVEMENT_MAP[a.id] = a;
}

class AchievementManager {
  constructor() {
    this.unlocked = new Set();
    this.callbacks = [];
    this.load();
  }

  load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var data = JSON.parse(raw);
        // 幂等去重：只识别 ACHIEVEMENT_MAP 里存在的 ID
        this.unlocked = new Set(
          (data.unlocked || []).filter(id => ACHIEVEMENT_MAP[id])
        );
      }
    } catch (e) {
      this.unlocked = new Set();
    }
  }

  save() {
    try {
      var data = { unlocked: Array.from(this.unlocked) };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) { /* ignore */ }
  }

  isUnlocked(id) {
    return this.unlocked.has(id);
  }

  static getRarity(rarity) {
    return RARITY_COLORS[rarity] || RARITY_COLORS.common;
  }

  static get(id) {
    return ACHIEVEMENT_MAP[id];
  }

  getAll() {
    return ACHIEVEMENT_LIST.map(a => ({
      ...a,
      unlocked: this.unlocked.has(a.id),
      rarityInfo: RARITY_COLORS[a.rarity],
    }));
  }

  unlock(id) {
    if (!ACHIEVEMENT_MAP[id]) return false;
    if (this.unlocked.has(id)) return false;
    this.unlocked.add(id);
    this.save();
    var achievement = ACHIEVEMENT_MAP[id];
    for (var cb of this.callbacks) {
      try { cb(achievement); } catch (e) { /* ignore */ }
    }
    return achievement;
  }

  onUnlock(callback) {

// 对象池：复用对象减少 GC
class ObjectPool {
  constructor(factory, resetFn, max = 50) {
    this.factory = factory;
    this.resetFn = resetFn;
    this.max = max;
    this.pool = [];
    this.active = [];
  }

  acquire() {
    var obj;
    if (this.pool.length > 0) {
      obj = this.pool.pop();
    } else {
      obj = this.factory();
    }
    this.active.push(obj);
    return obj;
  }

  release(obj) {
    var idx = this.active.indexOf(obj);
    if (idx >= 0) {
      this.active.splice(idx, 1);
      if (this.resetFn) this.resetFn(obj);
      if (this.pool.length < this.max) {
        this.pool.push(obj);
      }
    }
  }

  releaseAll() {
    while (this.active.length > 0) {
      var obj = this.active.pop();
      if (this.resetFn) this.resetFn(obj);
      if (this.pool.length < this.max) {
        this.pool.push(obj);
      }
    }
  }

  forEachActive(fn) {
    for (var i = this.active.length - 1; i >= 0; i--) {
      fn(this.active[i], i);
    }
  }

  getActive() {
    return this.active;
  }

  clear() {
    this.releaseAll();
  }
}

function placeLetter(grid, template, startCol, startRow) {
  for (var r = 0; r < template.length; r++) {
    for (var c = 0; c < template[r].length; c++) {
      var ch = template[r][c];
      if (ch === 'S') grid[startRow + r][startCol + c] = STEEL;
      else if (ch === 'B') grid[startRow + r][startCol + c] = BRICK;
    }
  }
}

function placeBaseProtection(grid) {
  // 完整一圈保护（环绕基地本体）：15 格 = 精确 20% 钢(3) + 80% 砖(12)

function buildSpaceGrid() {
  var grid = createEmptyGrid();

  placeLetter(grid, N_UPPER, 3, 4);
  placeLetter(grid, Y_UPPER, 10, 4);

  placeBaseProtection(grid);

  // 自由障碍区：太空站模块 + 能量水晶

    [18, 1, 'BBBB'], [18, 6, 'BBBB'], [18, 17, 'BBBB'], [18, 22, 'BBB'],
    // 中央教学楼群 - 移除 col 14 区域避免覆盖保护圈

  for (var [row, col, pattern] of buildings) {
    for (var i = 0; i < pattern.length; i++) {
      if (pattern[i] === 'B') grid[row][col + i] = BRICK;
    }
  }

  // 操场跑道（草丛绿化带）- 避开保护圈

  for (var [row, col, pattern] of grassAreas) {

      if (pattern[i] === 'G') grid[row][col + i] = GRASS;

  // 校园水景（喷泉/池塘）

// Base 基地类

class Base {
  constructor() {
    this.col = 12;
    this.row = 24;
    this.x = this.col * TILE_SIZE;
    this.y = this.row * TILE_SIZE + MAP_OFFSET_Y;
    this.w = TILE_SIZE * 2;
    this.h = TILE_SIZE * 2;
    this.alive = true;
    this.flashTime = 0;
    this.pulseTime = 0;
  }

  reset() {
    this.alive = true;
    this.flashTime = 0;
    this.pulseTime = 0;
  }

  hit() {
    this.alive = false;
  }

  update(dt) {
    this.pulseTime += dt;
    if (!this.alive) {
      this.flashTime += dt;
    }
  }

  getBounds() {
    return { x: this.x, y: this.y, w: this.w, h: this.h };
  }

  render(ctx, colors) {
    var cx = this.x + this.w / 2;
    var cy = this.y + this.h / 2;

    if (!this.alive) {
      // 被摧毁：绘制残骸（更明显）
      var flash = Math.sin(this.flashTime * 0.02) > 0;
      if (flash) {
        ctx.fillStyle = 'rgba(80, 40, 40, 0.7)';
        ctx.fillRect(this.x, this.y, this.w, this.h);
      }
      // 残骸边框
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 3;
      ctx.strokeRect(this.x + 2, this.y + 2, this.w - 4, this.h - 4);
      // 残骸标记
      ctx.fillStyle = '#888';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('✕', cx, cy);
      return;
    }

    // 呼吸光晕效果
    var pulse = 0.5 + 0.5 * Math.sin(this.pulseTime * 0.004);
    var glowR = 38 + pulse * 6;

    // 外层金色光晕
    var glow = ctx.createRadialGradient(cx, cy, 10, cx, cy, glowR);
    glow.addColorStop(0, 'rgba(255, 215, 110, 0.55)');
    glow.addColorStop(0.5, 'rgba(255, 180, 60, 0.25)');
    glow.addColorStop(1, 'rgba(255, 150, 40, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(this.x - 12, this.y - 12, this.w + 24, this.h + 24);

    // ============ 第一层：深色底座 ============
    ctx.fillStyle = '#3D1A1A';
    ctx.fillRect(this.x + 2, this.y + 4, this.w - 4, this.h - 6);

    // ============ 第二层：城堡主体（红色填充 + 金色厚描边） ============
    var bx = this.x + 5;
    var by = this.y + 7;
    var bw = this.w - 10;
    var bh = this.h - 14;

    // 城堡主体填充
    var bodyGrad = ctx.createLinearGradient(bx, by, bx, by + bh);
    bodyGrad.addColorStop(0, '#FF5A5A');
    bodyGrad.addColorStop(0.5, '#E53935');
    bodyGrad.addColorStop(1, '#B71C1C');
    ctx.fillStyle = bodyGrad;

    // 绘制城堡形状（带城垛）
    ctx.beginPath();
    var crenelW = bw / 5;
    var crenelH = 8;
    // 左竖边
    ctx.moveTo(bx, by + crenelH);
    // 左上角垛口
    ctx.lineTo(bx, by);
    ctx.lineTo(bx + crenelW, by);
    ctx.lineTo(bx + crenelW, by + crenelH);
    ctx.lineTo(bx + crenelW * 2, by + crenelH);
    ctx.lineTo(bx + crenelW * 2, by);
    ctx.lineTo(bx + crenelW * 3, by);
    ctx.lineTo(bx + crenelW * 3, by + crenelH);
    ctx.lineTo(bx + crenelW * 4, by + crenelH);
    ctx.lineTo(bx + crenelW * 4, by);
    ctx.lineTo(bx + crenelW * 5, by);
    ctx.lineTo(bx + crenelW * 5, by + crenelH);
    // 右边
    ctx.lineTo(bx + bw, by + crenelH);
    ctx.lineTo(bx + bw, by + bh);
    // 底部带圆弧
    ctx.quadraticCurveTo(bx + bw, by + bh + 4, bx + bw - 4, by + bh + 4);
    ctx.lineTo(bx + 4, by + bh + 4);
    ctx.quadraticCurveTo(bx, by + bh + 4, bx, by + bh);
    ctx.closePath();
    ctx.fill();

    // 金色厚描边
    ctx.strokeStyle = '#FFD76E';
    ctx.lineWidth = 3.5;
    ctx.lineJoin = 'round';
    ctx.stroke();

    // 内侧深红色描边（增加层次感）
    ctx.strokeStyle = '#8B0000';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // ============ 第三层：城堡大门 ============
    var doorW = 18;
    var doorH = 24;
    var doorX = cx - doorW / 2;
    var doorY = by + bh - doorH + 2;
    // 大门渐变
    var doorGrad = ctx.createLinearGradient(doorX, doorY, doorX, doorY + doorH);
    doorGrad.addColorStop(0, '#6D4C41');
    doorGrad.addColorStop(1, '#3E2723');
    ctx.fillStyle = doorGrad;
    ctx.beginPath();
    ctx.moveTo(doorX, doorY + doorH);
    ctx.lineTo(doorX, doorY + doorH * 0.4);
    ctx.quadraticCurveTo(doorX, doorY, cx, doorY);
    ctx.quadraticCurveTo(doorX + doorW, doorY, doorX + doorW, doorY + doorH * 0.4);
    ctx.lineTo(doorX + doorW, doorY + doorH);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#FFD76E';
    ctx.lineWidth = 2;
    ctx.stroke();
    // 门钉
    ctx.fillStyle = '#FFD76E';
    ctx.beginPath();
    ctx.arc(cx - 4, doorY + doorH * 0.5, 1.8, 0, Math.PI * 2);
    ctx.arc(cx + 4, doorY + doorH * 0.5, 1.8, 0, Math.PI * 2);
    ctx.fill();

    // ============ 第四层：中央大旗 + 五角星 ============
    // 旗杆
    var poleX = cx;
    var poleTop = by - 14;
    var poleBottom = by + crenelH + 6;
    ctx.strokeStyle = '#FFD76E';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(poleX, poleTop);
    ctx.lineTo(poleX, poleBottom);
    ctx.stroke();
    // 旗杆顶珠
    ctx.fillStyle = '#FFEB3B';
    ctx.beginPath();
    ctx.arc(poleX, poleTop - 2, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#F57F17';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 旗帜（飘动效果）
    var flagWave = Math.sin(this.pulseTime * 0.006) * 2;
    ctx.fillStyle = '#FFEB3B';
    ctx.beginPath();
    ctx.moveTo(poleX + 1, poleTop + 1);
    ctx.lineTo(poleX + 18 + flagWave, poleTop + 5);
    ctx.lineTo(poleX + 15 + flagWave * 0.5, poleTop + 8);
    ctx.lineTo(poleX + 18 + flagWave, poleTop + 11);
    ctx.lineTo(poleX + 1, poleTop + 15);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#F57F17';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 大旗中央小五角星
    drawStar(ctx, poleX + 10, poleTop + 8, 5, 3, 1.3, '#E53935', '#8B0000');

    // ============ 第五层：城堡中央大五角星（发光） ============
    var starCx = cx;
    var starCy = by + crenelH + 18;
    // 星星光晕
    var starGlow = ctx.createRadialGradient(starCx, starCy, 2, starCx, starCy, 16);
    starGlow.addColorStop(0, 'rgba(255, 235, 59, 0.6)');
    starGlow.addColorStop(1, 'rgba(255, 235, 59, 0)');
    ctx.fillStyle = starGlow;
    ctx.fillRect(starCx - 18, starCy - 18, 36, 36);
    // 大五角星
    drawStar(ctx, starCx, starCy, 5, 11, 4.5, '#FFEB3B', '#E65100');

    // ============ 第六层：左右两侧塔楼顶小旗 ============
    // 左塔
    drawStar(ctx, bx + crenelW * 0.5, by + crenelH * 0.5, 5, 3, 1.2, '#FFEB3B', '#E65100');
    // 右塔
    drawStar(ctx, bx + crenelW * 4.5, by + crenelH * 0.5, 5, 3, 1.2, '#FFEB3B', '#E65100');

    // ============ 第七层：底部"基地"文字（醒目） ============
    ctx.save();
    ctx.font = 'bold 11px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // 外发光阴影
    ctx.shadowColor = 'rgba(255, 100, 100, 0.9)';
    ctx.shadowBlur = 6;
    // 黑色粗描边
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText('基 地', cx, this.y + this.h - 6);
    // 红色填充
    ctx.fillStyle = '#FF3D00';
    ctx.fillText('基 地', cx, this.y + this.h - 6);
    ctx.restore();

    // ============ 第八层：最外层脉冲光环（呼吸效果） ============
    var ringAlpha = 0.35 + pulse * 0.35;
    ctx.strokeStyle = `rgba(255, 215, 110, ${ringAlpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 36 + pulse * 3, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// Bullet 子弹类

class Bullet {
  constructor() {
    this.alive = false;
    this.reset();
  }

  reset() {
    this.x = 0;
    this.y = 0;
    this.direction = Direction.UP;
    this.speed = BULLET_SPEED;
    this.owner = 'player';
    this.size = BULLET_SIZE;
    this.alive = false;
  }

  init(x, y, direction, owner) {
    this.x = x;
    this.y = y;
    this.direction = direction;
    this.owner = owner;
    this.speed = BULLET_SPEED;
    this.size = BULLET_SIZE;
    this.alive = true;
  }

  update(dt) {
    if (!this.alive) return;
    var v = DIR_VECTORS[this.direction];
    this.x += v.dx * this.speed;
    this.y += v.dy * this.speed;
    // 超出画布销毁
    if (this.x < 0 || this.x > 832 || this.y < 48 || this.y > 880) {
      this.alive = false;
    }
  }

  getBounds() {
    return {
      x: this.x - this.size / 2,
      y: this.y - this.size / 2,
      w: this.size,
      h: this.size,
    };
  }

  render(ctx) {
    if (!this.alive) return;
    var color = this.owner === 'player' ? BulletColors.player : BulletColors.enemy;
    // 外发光（半径随子弹大小同比增加，强化视觉冲击）
    ctx.shadowColor = color;
    ctx.shadowBlur = 16;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
    ctx.fill();
    // 内核
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size / 4, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Effect 特效类

class Effect {
  constructor() {
    this.alive = false;
    this.reset();
  }

  reset() {
    this.type = EffectType.EXPLOSION_SMALL;
    this.x = 0;
    this.y = 0;
    this.duration = 300;
    this.elapsed = 0;
    this.text = '';
    this.intensity = 8;
    this.alive = false;
  }

  init(type, x = 0, y = 0, options = {}) {
    this.type = type;
    this.x = x;
    this.y = y;
    this.text = options.text || '';
    this.icon = options.icon || '';
    this.rarity = options.rarity || 'common';
    this.intensity = options.intensity || 8;
    this.elapsed = 0;
    this.alive = true;

    switch (type) {
      case EffectType.EXPLOSION_SMALL:
        this.duration = 250;
        break;
      case EffectType.EXPLOSION_LARGE:
        this.duration = 500;
        break;
      case EffectType.SPAWN:
        this.duration = 600;
        break;
      case EffectType.TEXT:
        this.duration = 800;
        break;
      case EffectType.HIT_FLASH:
        this.duration = 200;
        break;
      case EffectType.SCREEN_SHAKE:
        this.duration = 300;
        break;
      case EffectType.COMBO:
        this.duration = 800;
        break;
      case EffectType.ACHIEVEMENT:
        this.duration = 3000;
        break;
      default:
        this.duration = 300;
    }
    // 支持自定义持续时间（如基地爆炸特效需要更长播放时间）
    if (options.duration) {
      this.duration = options.duration;
    }
  }

  update(dt) {
    if (!this.alive) return;
    this.elapsed += dt;
    if (this.elapsed >= this.duration) {
      this.alive = false;
    }
  }

  // 获取屏幕震动偏移量（SCREEN_SHAKE 专用）
  getShakeOffset() {
    if (this.type !== EffectType.SCREEN_SHAKE || !this.alive) {
      return { dx: 0, dy: 0 };
    }
    var progress = this.elapsed / this.duration;
    var decay = 1 - progress;
    var amplitude = this.intensity * decay;
    var dx = Math.sin(this.elapsed * 0.05) * amplitude;
    var dy = Math.cos(this.elapsed * 0.06) * amplitude;
    return { dx, dy };
  }

  render(ctx) {
    if (!this.alive) return;
    var progress = this.elapsed / this.duration;
    var alpha = 1 - progress;

    switch (this.type) {
      case EffectType.EXPLOSION_SMALL:
        this.renderExplosion(ctx, 16, alpha, progress);
        break;
      case EffectType.EXPLOSION_LARGE:
        this.renderExplosion(ctx, 32, alpha, progress);
        break;
      case EffectType.SPAWN:
        this.renderSpawn(ctx, alpha, progress);
        break;
      case EffectType.TEXT:
        this.renderText(ctx, alpha, progress);
        break;
      case EffectType.HIT_FLASH:
        this.renderHitFlash(ctx, alpha);
        break;
      case EffectType.COMBO:
        this.renderCombo(ctx, alpha, progress);
        break;
      case EffectType.ACHIEVEMENT:
        this.renderAchievement(ctx, alpha, progress);
        break;
      // SCREEN_SHAKE 不直接渲染
    }
  }

  renderExplosion(ctx, size, alpha, progress) {
    var r = size * (0.5 + progress * 0.8);
    var grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
    grad.addColorStop(0, `rgba(255, 255, 200, ${alpha})`);
    grad.addColorStop(0.4, `rgba(255, 180, 80, ${alpha * 0.8})`);
    grad.addColorStop(0.8, `rgba(200, 80, 40, ${alpha * 0.4})`);
    grad.addColorStop(1, 'rgba(100, 30, 10, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  renderSpawn(ctx, alpha, progress) {
    var size = 28;
    var cx = this.x;
    var cy = this.y;
    var angle = progress * Math.PI * 4;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#7CC4FF';
    ctx.lineWidth = 2;
    ctx.strokeRect(-size / 2, -size / 2, size, size);
    ctx.rotate(Math.PI / 4);
    ctx.strokeStyle = '#FFD76E';
    ctx.strokeRect(-size / 2, -size / 2, size, size);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  renderText(ctx, alpha, progress) {
    var offsetY = -progress * 30;
    var scale = 1 + progress * 0.2;
    ctx.save();
    ctx.translate(this.x, this.y + offsetY);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;
    drawText(ctx, this.text, 0, 0, {
      font: 'bold 18px sans-serif',
      color: '#FFD76E',
      align: 'center',
      baseline: 'middle',
      stroke: '#5E3DB5',
      strokeWidth: 3,
    });
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  renderHitFlash(ctx, alpha) {
    var a = 0.4 * alpha;
    ctx.fillStyle = `rgba(255, 80, 80, ${a})`;
    ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  }

  renderCombo(ctx, alpha, progress) {
    var offsetY = -progress * 60;
    var scale = 1.2 - progress * 0.2;
    var color = '#FFD76E';
    if (this.text.includes('×5')) color = '#FF9E5E';
    else if (this.text.includes('×10')) color = '#FF6BCB';
    ctx.save();
    ctx.translate(this.x, this.y + offsetY);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;
    drawText(ctx, this.text, 0, 0, {
      font: 'bold 56px sans-serif',
      color: color,
      align: 'center',
      baseline: 'middle',
      stroke: 'rgba(0,0,0,0.8)',
      strokeWidth: 6,
      shadow: { color: color, blur: 16 },
    });
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // 成就解锁横幅（右上角滑入+淡出）
  renderAchievement(ctx, alpha, progress) {
    var rarity = AchievementManager.getRarity(this.rarity);
    var width = 320;
    var height = 72;
    var padX = CANVAS_WIDTH - width - 20;

    // 入场阶段：0~15% 从右滑入；中段 15%~85% 固定；85%~100% 淡出
    var bannerAlpha;
    var slideX;
    if (progress < 0.15) {
      var p = progress / 0.15;
      slideX = (1 - p) * (width + 40);
      bannerAlpha = p;
    } else if (progress < 0.85) {
      slideX = 0;
      bannerAlpha = 1;
    } else {
      var p = (progress - 0.85) / 0.15;
      slideX = 0;
      bannerAlpha = 1 - p;
    }

    var bannerY = 20;
    var x = padX + slideX;
    var y = bannerY;

    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, bannerAlpha));

    // 外发光
    ctx.shadowColor = rarity.glow;
    ctx.shadowBlur = 16;

    // 卡片背景
    ctx.fillStyle = 'rgba(18, 15, 35, 0.92)';
    ctx.beginPath();
    var r = 12;
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + width - r, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + r);
    ctx.lineTo(x + width, y + height - r);
    ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
    ctx.lineTo(x + r, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    // 边框
    ctx.strokeStyle = rarity.color;
    ctx.lineWidth = 2;
    ctx.stroke();

    // 稀有度标签
    ctx.fillStyle = rarity.color;
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(`🏆 成就解锁 · ${rarity.name}`, x + 16, y + 10);

    // 图标
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.icon || '🎖️', x + 16, y + height / 2 + 8);

    // 名称
    ctx.fillStyle = rarity.color;
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.text, x + 60, y + height / 2 + 8);

    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

    this.x = 0;
    this.y = 0;
    this.size = 14;
    this.alive = false;
    this.animTime = 0;
    this.bobOffset = 0;
  }

    this.x = x;
    this.y = y;
    this.size = 14;
    this.alive = true;

    this.animTime += dt * 0.005;

    return {

      y: this.y - this.size / 2 + this.bobOffset,

    ctx.arc(this.x, cy, this.size / 2, 0, Math.PI * 2);
    ctx.fill();

// ===== 模块: entities/ArtilleryStrike.js =====
// 炮弹雨轰炸系统

class ArtilleryStrike {
  constructor() {
    this.active = false;
    this.phase = 'idle'; // idle | warning | striking
    this.timer = 0;
    this.zoneX = 0;
    this.zoneY = 0;
    this.zoneW = 0;
    this.zoneH = 0;
    this.shells = [];
    this.shellTimer = 0;
    this.shellInterval = 150;
    this.shellsPerBurst = ARTILLERY_SHELLS;
    this.shellsFired = 0;
  }

  reset() {
    this.active = false;
    this.phase = 'idle';
    this.timer = 0;
    this.shells = [];
    this.shellsFired = 0;
  }

  // 在指定区域触发轰炸
  trigger(zoneX, zoneY, zoneW, zoneH) {
    this.active = true;
    this.phase = 'warning';
    this.timer = ARTILLERY_WARNING_TIME;
    this.zoneX = zoneX;
    this.zoneY = zoneY;
    this.zoneW = zoneW;
    this.zoneH = zoneH;
    this.shells = [];
    this.shellsFired = 0;
    this.shellTimer = 0;
  }

  update(dt, map, tanks, effects) {
    if (!this.active) return;

    this.timer -= dt;

    if (this.phase === 'warning') {
      if (this.timer <= 0) {
        this.phase = 'striking';
        this.timer = 0;
        this.shellsFired = 0;
        this.shellTimer = 0;
      }
    } else if (this.phase === 'striking') {
      this.shellTimer += dt;
      while (this.shellTimer >= this.shellInterval && this.shellsFired < this.shellsPerBurst) {
        this.shellTimer -= this.shellInterval;
        this.fireShell(map, tanks, effects);
        this.shellsFired++;
      }
      if (this.shellsFired >= this.shellsPerBurst && this.shells.every(s => s.done)) {
        this.active = false;
        this.phase = 'idle';
      }
    }

    // 更新已发射的炮弹
    for (var s of this.shells) {
      if (!s.done) {
        s.elapsed += dt;
        s.progress = Math.min(1, s.elapsed / 600);
        if (s.progress >= 1 && !s.hit) {
          s.hit = true;
          this.applyShellDamage(s, map, tanks, effects);
        }
        if (s.elapsed > 900) s.done = true;
      }
    }
  }

  fireShell(map, tanks, effects) {
    var tx = this.zoneX + Math.random() * (this.zoneW - 32);
    var ty = this.zoneY + Math.random() * (this.zoneH - 32);
    this.shells.push({
      x: tx, y: ty,
      elapsed: 0, progress: 0,
      hit: false, done: false,
      size: 8 + Math.random() * 6,
    });
  }

  applyShellDamage(shell, map, tanks, effects) {
    var sx = shell.x + 16;
    var sy = shell.y + 16;
    var radius = 40;

    // 对区域内的坦克造成伤害
    for (var tank of tanks) {
      if (!tank.alive) continue;
      var cx = tank.x + tank.size / 2;
      var cy = tank.y + tank.size / 2;
      var dx = cx - sx;
      var dy = cy - sy;
      if (Math.sqrt(dx * dx + dy * dy) < radius) {
        tank.takeDamage(1, effects);
        if (!tank.alive && tank.type !== 'player') {
          effects.spawn(EffectType.EXPLOSION_LARGE, tank.x + tank.size / 2, tank.y + tank.size / 2);
        }
      }
    }

    // 摧毁区域内砖墙
    var col0 = Math.floor(shell.x / TILE_SIZE);
    var row0 = Math.floor((shell.y - MAP_OFFSET_Y) / TILE_SIZE);
    for (var r = row0 - 1; r <= row0 + 1; r++) {
      for (var c = col0 - 1; c <= col0 + 1; c++) {
        if (r >= 0 && r < MAP_ROWS && c >= 0 && c < MAP_COLS) {
          if (map.grid[r][c] === TileType.BRICK) {
            map.grid[r][c] = TileType.EMPTY;
          }
        }
      }
    }

    // 爆炸特效
    effects.spawn(EffectType.EXPLOSION_LARGE, sx, sy);
  }

  render(ctx, offsetY) {
    if (!this.active) return;
    ctx.save();
    ctx.translate(0, offsetY);

    if (this.phase === 'warning') {
      // 红色闪烁预警区
      var flash = Math.sin(this.timer * 0.015) > 0;
      ctx.fillStyle = flash ? 'rgba(255, 50, 50, 0.25)' : 'rgba(255, 50, 50, 0.1)';
      ctx.fillRect(this.zoneX, this.zoneY, this.zoneW, this.zoneH);
      ctx.strokeStyle = '#FF3333';
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 5]);
      ctx.strokeRect(this.zoneX, this.zoneY, this.zoneW, this.zoneH);
      ctx.setLineDash([]);
      // 警告文字
      ctx.fillStyle = '#FF3333';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('⚠ 空袭预警 ⚠', this.zoneX + this.zoneW / 2, this.zoneY - 20);
    }

    // 渲染下落的炮弹
    for (var s of this.shells) {
      if (s.done) continue;
      if (!s.hit) {
        var py = this.zoneY + (s.y - this.zoneY) * s.progress;
        var px = s.x;
        // 炮弹拖尾
        ctx.fillStyle = 'rgba(255, 100, 30, 0.4)';
        ctx.beginPath();
        ctx.arc(px + 16, py - 20 + 16, s.size * 0.6, 0, Math.PI * 2);
        ctx.fill();
        // 炮弹主体
        ctx.fillStyle = '#FF4422';
        ctx.beginPath();
        ctx.arc(px + 16, py + 16, s.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FFAA00';
        ctx.beginPath();
        ctx.arc(px + 16, py + 16, s.size * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.restore();
  }
}

// ===== 模块: entities/Tank.js =====
// Tank 坦克基类

class Tank {
  constructor(type = 'enemy_normal') {
    this.type = type;
    this.x = 0;
    this.y = 0;
    this.direction = Direction.UP;
    this.speed = 1.5;
    this.hp = 1;
    this.maxHp = 1;
    this.size = TANK_SIZE;
    this.alive = true;
    this.animFrame = 0;
    this.animTimer = 0;
    this.fireCooldown = 0;
    this.fireCD = 500;
    this.invincible = false;
    this.invincibleTimer = 0;
    this.moving = false;
  }

  init(x, y, direction) {
    this.x = x;
    this.y = y;
    this.direction = direction;
    this.alive = true;
    this.animFrame = 0;
    this.animTimer = 0;
    this.fireCooldown = 0;
    this.invincible = false;
    this.invincibleTimer = 0;
    this.moving = false;
  }

  // 尝试移动，返回是否实际移动
  move(direction, map, tanks, dt) {
    this.direction = direction;
    var v = DIR_VECTORS[direction];
    // 使用 dt 计算移动距离，确保不同帧率下移速一致
    var frameDt = dt / 16.667; // 归一化到 60fps
    var newX = this.x + v.dx * this.speed * frameDt;
    var newY = this.y + v.dy * this.speed * frameDt;

    // 格子吸附（垂直移动时对齐 X，水平移动时对齐 Y）
    var snapX = newX;
    var snapY = newY;
    if (v.dx !== 0) {
      // 水平移动，Y 吸附到格子
      snapY = Math.round((this.y - MAP_OFFSET_Y) / TILE_SIZE) * TILE_SIZE + MAP_OFFSET_Y;
    }
    if (v.dy !== 0) {
      // 垂直移动，X 吸附到格子
      snapX = Math.round(this.x / TILE_SIZE) * TILE_SIZE;
    }

    // 边界检查
    if (snapX < 0 || snapX + this.size > 832) return false;
    if (snapY < MAP_OFFSET_Y || snapY + this.size > 880) return false;

    // 瓦片碰撞检查
    if (this.checkTileCollision(snapX, snapY, map)) return false;

    // 坦克碰撞检查
    if (this.checkTankCollision(snapX, snapY, tanks)) return false;

    this.x = snapX;
    this.y = snapY;
    this.moving = true;
    return true;
  }

  checkTileCollision(x, y, map) {
    var bounds = { x, y, w: this.size, h: this.size };
    var startCol = Math.floor(bounds.x / TILE_SIZE);
    var endCol = Math.floor((bounds.x + bounds.w - 1) / TILE_SIZE);
    var startRow = Math.floor((bounds.y - MAP_OFFSET_Y) / TILE_SIZE);
    var endRow = Math.floor((bounds.y + bounds.h - 1 - MAP_OFFSET_Y) / TILE_SIZE);

    for (var r = startRow; r <= endRow; r++) {
      for (var c = startCol; c <= endCol; c++) {
        if (map.isBlockedForTank(r, c)) return true;
      }
    }
    return false;
  }

  checkTankCollision(x, y, tanks) {
    var bounds = { x, y, w: this.size, h: this.size };
    for (var t of tanks) {
      if (t === this || !t.alive) continue;
      var other = { x: t.x, y: t.y, w: t.size, h: t.size };
      if (bounds.x < other.x + other.w &&
          bounds.x + bounds.w > other.x &&
          bounds.y < other.y + other.h &&
          bounds.y + bounds.h > other.y) {
        return true;
      }
    }
    return false;
  }

  // 尝试开火，返回 Bullet 或 null
  fire(bulletPool) {
    if (this.fireCooldown > 0 || !this.alive) return null;
    this.fireCooldown = this.fireCD;
    var v = DIR_VECTORS[this.direction];
    var cx = this.x + this.size / 2;
    var cy = this.y + this.size / 2;
    var offset = this.size / 2 + 4;
    var bx = cx + v.dx * offset;
    var by = cy + v.dy * offset;
    var bullet = bulletPool.acquire();
    bullet.init(bx, by, this.direction, this.type === 'player' ? 'player' : 'enemy');
    return bullet;
  }

  takeDamage(dmg) {
    if (this.invincible) return false;
    this.hp -= dmg;
    if (this.hp <= 0) {
      this.alive = false;
    }
    return true;
  }

  update(dt, map, tanks, bulletPool, effects) {
    if (!this.alive) return;
    this.fireCooldown = Math.max(0, this.fireCooldown - dt);
    if (this.invincible) {
      this.invincibleTimer -= dt;
      if (this.invincibleTimer <= 0) {
        this.invincible = false;
      }
    }
    // 履带动画
    if (this.moving) {
      this.animTimer += dt;
      if (this.animTimer > 100) {
        this.animFrame = (this.animFrame + 1) % 2;
        this.animTimer = 0;
      }
      this.moving = false;
    }
  }

  getBounds() {
    return { x: this.x, y: this.y, w: this.size, h: this.size };
  }

  render(ctx) {
    if (!this.alive) return;
    // 无敌闪烁
    if (this.invincible && Math.floor(this.invincibleTimer / 80) % 2 === 0) {
      return;
    }
    var colors = TankColors[this.type] || TankColors.enemy_normal;
    var cx = this.x + this.size / 2;
    var cy = this.y + this.size / 2;
    var angle = this.getDirectionAngle();

    drawRotated(ctx, cx, cy, angle, (ctx) => {
      this.drawTankBody(ctx, colors);
    });
  }

  drawTankBody(ctx, colors) {
    var s = this.size;
    var half = s / 2;
    // 履带
    ctx.fillStyle = colors.stroke;
    ctx.fillRect(-half, -half, 6, s);
    ctx.fillRect(half - 6, -half, 6, s);
    // 履带纹理
    ctx.fillStyle = colors.body;
    var treadOffset = this.animFrame * 3;
    for (var i = -half; i < half; i += 6) {
      ctx.fillRect(-half + 1, i + treadOffset, 4, 3);
      ctx.fillRect(half - 5, i + treadOffset, 4, 3);
    }
    // 车身
    ctx.fillStyle = colors.body;
    ctx.fillRect(-half + 6, -half + 4, s - 12, s - 8);
    ctx.strokeStyle = colors.stroke;
    ctx.lineWidth = 2;
    ctx.strokeRect(-half + 6, -half + 4, s - 12, s - 8);
    // 炮塔
    ctx.fillStyle = colors.stroke;
    ctx.beginPath();
    ctx.arc(0, 0, 7, 0, Math.PI * 2);
    ctx.fill();
    // 炮管
    ctx.fillStyle = colors.stroke;
    ctx.fillRect(-2, -half - 2, 4, half + 2);
    // 装饰点
    ctx.fillStyle = colors.accent;
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  getDirectionAngle() {
    switch (this.direction) {
      case Direction.UP: return 0;
      case Direction.RIGHT: return Math.PI / 2;
      case Direction.DOWN: return Math.PI;
      case Direction.LEFT: return -Math.PI / 2;
      default: return 0;
    }
  }
}

// ===== 模块: entities/PlayerTank.js =====
// PlayerTank 玩家坦克

class PlayerTank extends Tank {
  constructor() {
    super('player');
    this.speed = PLAYER_SPEED;
    this.hp = PLAYER_MAX_HP;
    this.maxHp = PLAYER_MAX_HP;
    this.fireCD = PLAYER_FIRE_CD;
    // 连击系统
    this.comboCount = 0;
    this.lastKillTime = -Infinity;
    this.scoreFlashTimer = 0;
    // 弹药系统
    this.ammo = PLAYER_MAX_AMMO;
    this.maxAmmo = PLAYER_MAX_AMMO;
    this.coins = 0;
    // 道具效果
    this.propSpeedTimer = 0;
    this.propShieldTimer = 0;
  }

  init(x, y, direction = Direction.UP) {
    super.init(x, y, direction);
    this.hp = this.maxHp;
    this.comboCount = 0;
    this.lastKillTime = -Infinity;
    this.invincible = true;
    this.invincibleTimer = PLAYER_SPAWN_INVINCIBLE;
    this.scoreFlashTimer = 0;
    this.ammo = this.maxAmmo;
    this.coins = 0;
    this.propSpeedTimer = 0;
    this.propShieldTimer = 0;
  }

  // 重写受击逻辑：触发红闪 + 屏幕震动 + 1秒无敌 + 连击清零
  takeDamage(dmg, effects) {
    if (this.invincible || !this.alive) return false;
    this.hp -= dmg;
    this.comboCount = 0;
    // 受击视觉反馈
    if (effects) {
      effects.spawn(EffectType.HIT_FLASH, 0, 0);
      effects.spawn(EffectType.SCREEN_SHAKE, 0, 0, { intensity: 8 });
    }
    if (this.hp <= 0) {
      this.alive = false;
    } else {
      this.invincible = true;
      this.invincibleTimer = PLAYER_HIT_INVINCIBLE;
    }
    return true;
  }

  update(dt, map, tanks, bulletPool, effects, inputManager) {
    if (!this.alive) return null;
    this.fireCooldown = Math.max(0, this.fireCooldown - dt);
    if (this.invincible) {
      this.invincibleTimer -= dt;
      if (this.invincibleTimer <= 0) this.invincible = false;
    }
    if (this.scoreFlashTimer > 0) this.scoreFlashTimer -= dt;

    // 处理输入
    if (inputManager) {
      var dir = -1;
      if (inputManager.isDown('up')) dir = Direction.UP;
      else if (inputManager.isDown('down')) dir = Direction.DOWN;
      else if (inputManager.isDown('left')) dir = Direction.LEFT;
      else if (inputManager.isDown('right')) dir = Direction.RIGHT;

      if (dir >= 0) {
        this.move(dir, map, tanks, dt);
      }

      if (inputManager.wasPressed('fire')) {
        if (this.ammo <= 0) return 'no_ammo';
        this.ammo--;
        return this.fire(bulletPool);
      }

      // 按R键消耗金币换子弹
      if (inputManager.wasPressed('reload')) {
        if (this.coins >= COINS_FOR_FULL) {
          this.coins -= COINS_FOR_FULL;
          this.ammo = Math.min(this.maxAmmo, this.ammo + COIN_AMMO_FULL);
          return 'reload_full';
        } else if (this.coins >= 1) {
          this.coins -= 1;
          this.ammo = Math.min(this.maxAmmo, this.ammo + COIN_AMMO_SMALL);
          return 'reload_small';
        }
        return 'reload_fail';
      }
    }
    // 履带动画始终更新（无论是否有输入）
    this.updateAnim(dt);
    return null;
  }

  updateAnim(dt) {
    if (this.moving) {
      this.animTimer += dt;
      if (this.animTimer > 100) {
        this.animFrame = (this.animFrame + 1) % 2;
        this.animTimer = 0;
      }
      this.moving = false;
    }
  }

  updatePropEffects(dt) {
    if (this.propSpeedTimer > 0) {
      this.propSpeedTimer -= dt;
      this.speed = PLAYER_SPEED * 1.6;
      if (this.propSpeedTimer <= 0) this.speed = PLAYER_SPEED;
    }
    if (this.propShieldTimer > 0) {
      this.propShieldTimer -= dt;
      this.invincible = true;
      this.invincibleTimer = Math.max(this.invincibleTimer, this.propShieldTimer);
    }
  }

  // 击杀敌人时调用 - 击杀即叠加（无超时窗口）
  onKill(time, baseScore, effects) {
    // 只要击杀敌人就持续叠加（不再清零）
    this.comboCount++;
    this.lastKillTime = time;

    // 计算倍率
    var mult = this.getMultiplier();
    var finalScore = Math.round(baseScore * mult);

    // 触发 COMBO 飘字（≥1 杀就显示，不再要求≥3）
    if (effects) {
      var tier = this.getComboTier();
      if (tier) {
        effects.spawn(EffectType.COMBO, 416, 400, { text: tier.label });
        if (this.comboCount >= 10) {
          effects.spawn(EffectType.SCREEN_SHAKE, 0, 0, { intensity: 6 });
        }
      }
    }
    return finalScore;
  }

  getMultiplier() {
    if (this.comboCount >= 10) return 3.0;
    if (this.comboCount >= 5) return 2.0;
    if (this.comboCount >= 3) return 1.5;
    return 1.0;
  }

  getComboTier() {
    if (this.comboCount >= 10) return { label: `COMBO ×${this.comboCount}`, color: '#FF6BCB' };
    if (this.comboCount >= 5) return { label: `COMBO ×${this.comboCount}`, color: '#FF9E5E' };
    if (this.comboCount >= 3) return { label: `COMBO ×${this.comboCount}`, color: '#FFD76E' };
    if (this.comboCount >= 1) return { label: `COMBO ×${this.comboCount}`, color: '#7CC4FF' };
    return null;
  }

  // 连击不再超时（只要击杀就叠加，受击才清零）
  checkComboTimeout(time) {
    // 留空：永久保留，直至玩家受击才重置
  }
}

// EnemyTank 敌方坦克

// AI 状态
var AIState = {
  WANDER: 'wander',
  CHASE: 'chase',
  STUCK: 'stuck',
};

class EnemyTank extends Tank {
  constructor(type = 'enemy_normal') {
    super(type);
    this.setupByType();
    this.aiState = AIState.WANDER;
    this.aiTimer = 0;
    this.aiThinkInterval = 500;
    this.stuckTimer = 0;
    this.fireTimer = randInt(ENEMY_FIRE_CD_MIN, ENEMY_FIRE_CD_MAX);
    this.aggression = 0.30; // 攻击欲望：0~1，越高越积极追击玩家
  }

  // 设置攻击欲望（由 Game 根据难度传入）
  setAggression(value) {
    this.aggression = Math.max(0, Math.min(1, value));
    // 攻击欲望越高，AI 思考间隔越短（反应更快）
    this.aiThinkInterval = Math.round(500 - this.aggression * 250); // 500ms → 250ms
  }

  setupByType() {
    switch (this.type) {
      case 'enemy_normal':
        this.speed = ENEMY_SPEED_NORMAL;
        this.hp = ENEMY_HP.enemy_normal;
        this.maxHp = this.hp;
        break;
      case 'enemy_fast':
        this.speed = ENEMY_SPEED_FAST;
        this.hp = ENEMY_HP.enemy_fast;
        this.maxHp = this.hp;
        break;
      case 'enemy_heavy':
        this.speed = ENEMY_SPEED_HEAVY;
        this.hp = ENEMY_HP.enemy_heavy;
        this.maxHp = this.hp;
        break;
    }
  }

  init(x, y, direction = Direction.DOWN) {
    super.init(x, y, direction);
    this.setupByType();
    this.aiState = AIState.WANDER;
    this.aiTimer = 0;
    this.stuckTimer = 0;
    this.fireTimer = randInt(ENEMY_FIRE_CD_MIN, ENEMY_FIRE_CD_MAX);
    this.invincible = true;
    this.invincibleTimer = ENEMY_SPAWN_INVINCIBLE;
  }

  update(dt, map, tanks, bulletPool, effects, player) {
    if (!this.alive) return null;
    this.fireCooldown = Math.max(0, this.fireCooldown - dt);
    if (this.invincible) {
      this.invincibleTimer -= dt;
      if (this.invincibleTimer <= 0) this.invincible = false;
    }

    this.aiTimer += dt;
    this.fireTimer -= dt;

    // AI 决策
    if (this.aiTimer >= this.aiThinkInterval) {
      this.think(player);
      this.aiTimer = 0;
    }

    // 执行移动
    var moved = this.move(this.direction, map, tanks, dt);
    if (!moved) {
      this.stuckTimer += dt;
      if (this.stuckTimer > 300) {
        this.aiState = AIState.STUCK;
        this.direction = randInt(0, 3);
        this.stuckTimer = 0;
      }
    } else {
      this.stuckTimer = 0;
    }

    // 履带动画
    this.updateAnim(dt);

    // 开火
    if (this.fireTimer <= 0) {
      this.fireTimer = randInt(ENEMY_FIRE_CD_MIN, ENEMY_FIRE_CD_MAX);
      // 检查是否正对玩家或基地方向
      if (this.canFireAtTarget(player)) {
        return this.fire(bulletPool);
      }
    }
    return null;
  }

  think(player) {
    // AI：攻击欲望越高，越倾向追击玩家
    var r = Math.random();
    if (this.aiState === AIState.STUCK) {
      this.aiState = AIState.WANDER;
      return;
    }

    // 追击概率 = aggression（普通30% / 困难55% / 噩梦80% / 炼狱95%）
    var chaseProb = this.aggression;
    // 随机方向概率随攻击欲望递减
    var wanderProb = Math.max(0.15, 0.45 - this.aggression * 0.3);

    if (r < chaseProb && player && player.alive) {
      // 朝玩家方向移动
      var dx = player.x - this.x;
      var dy = player.y - this.y;
      if (Math.abs(dx) > Math.abs(dy)) {
        this.direction = dx > 0 ? Direction.RIGHT : Direction.LEFT;
      } else {
        this.direction = dy > 0 ? Direction.DOWN : Direction.UP;
      }
      this.aiState = AIState.CHASE;
    } else if (r < chaseProb + wanderProb) {
      // 随机方向
      this.direction = randInt(0, 3);
      this.aiState = AIState.WANDER;
    }
    // 剩余概率保持当前方向
  }

  canFireAtTarget(player) {
    // 检查正前方是否有目标（玩家或基地）
    if (player && player.alive) {
      var myCol = Math.floor((this.x + this.size / 2) / TILE_SIZE);
      var myRow = Math.floor((this.y + this.size / 2 - MAP_OFFSET_Y) / TILE_SIZE);
      var pCol = Math.floor((player.x + player.size / 2) / TILE_SIZE);
      var pRow = Math.floor((player.y + player.size / 2 - MAP_OFFSET_Y) / TILE_SIZE);

      switch (this.direction) {
        case Direction.UP:
          if (myCol === pCol && pRow < myRow) return true;
          // 朝基地方向
          if (myCol >= 12 && myCol <= 13 && myRow > 24) return true;
          break;
        case Direction.DOWN:
          if (myCol === pCol && pRow > myRow) return true;
          break;
        case Direction.LEFT:
          if (myRow === pRow && pCol < myCol) return true;
          break;
        case Direction.RIGHT:
          if (myRow === pRow && pCol > myCol) return true;
          break;
      }
    }
    // 盲目开火概率随攻击欲望提升
    return Math.random() < (0.4 + this.aggression * 0.3);
  }

  updateAnim(dt) {
    if (this.moving) {
      this.animTimer += dt;
      if (this.animTimer > 100) {
        this.animFrame = (this.animFrame + 1) % 2;
        this.animTimer = 0;
      }
      this.moving = false;
    }
  }
}

// Map 管理器

class Map {
  constructor() {
    this.cols = MAP_COLS;
    this.rows = MAP_ROWS;
    this.tileSize = TILE_SIZE;
    this.grid = [];
    this.theme = 'airport';
    this.colors = ColorConfig.airport;
    this.animTime = 0;
  }

  load(mapData) {
    this.theme = mapData.theme;
    this.colors = ColorConfig[mapData.theme];
    // 深拷贝 grid
    this.grid = mapData.grid.map(row => [...row]);
    // 添加边界钢墙（保留敌人出生点和基地开口）
    this.addBorderWalls();
  }

  // 在地图最外圈添加钢墙边界
  // 跳过：敌人出生点(col 0/12/25, row 0~2)、基地保护圈(col 11~14, row 24~25)
  addBorderWalls() {
    var last = this.cols - 1; // 25
    var bottom = this.rows - 1; // 25
    var enemySpawnCols = [0, 12, 25];
    // 基地保护圈占 col 11~14, row 21~25，底部边界需跳过整个保护圈范围
    var baseProtectCols = [11, 12, 13, 14];

    // 顶部 row 0：跳过敌人出生点
    for (var c = 0; c < this.cols; c++) {
      if (!enemySpawnCols.includes(c)) {
        this.grid[0][c] = TileType.STEEL;
      }
    }
    // 底部 row 25：跳过基地保护圈（让保护圈的砖/钢设置生效）
    for (var c = 0; c < this.cols; c++) {
      if (!baseProtectCols.includes(c)) {
        this.grid[bottom][c] = TileType.STEEL;
      }
    }
    // 左侧 col 0：跳过 row 0~2（敌人出生通道）
    for (var r = 3; r < bottom; r++) {
      this.grid[r][0] = TileType.STEEL;
    }
    // 右侧 col 25：跳过 row 0~2（敌人出生通道）
    for (var r = 3; r < bottom; r++) {
      this.grid[r][last] = TileType.STEEL;
    }
  }

  getTile(row, col) {
    if (row < 0 || row >= this.rows || col < 0 || col >= this.cols) {
      return TileType.STEEL; // 边界视为钢墙
    }
    return this.grid[row][col];
  }

  setTile(row, col, type) {
    if (row >= 0 && row < this.rows && col >= 0 && col < this.cols) {
      this.grid[row][col] = type;
    }
  }

  worldToTile(x, y) {
    return {
      col: Math.floor(x / this.tileSize),
      row: Math.floor((y - MAP_OFFSET_Y) / this.tileSize),
    };
  }

  tileToWorld(col, row) {
    return {
      x: col * this.tileSize,
      y: row * this.tileSize + MAP_OFFSET_Y,
    };
  }

  isBlockedForTank(row, col) {
    return isBlockedForTank(this.getTile(row, col));
  }

  isBlockedForBullet(row, col) {
    return isBlockedForBullet(this.getTile(row, col));
  }

  update(dt) {
    this.animTime += dt;
  }

  // 辅助：构造圆角矩形路径（不 fill/stroke，只画路径）
  _roundRect(ctx, x, y, w, h, r) {
    if (r < 0) r = 0;
    if (r > w / 2) r = w / 2;
    if (r > h / 2) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // 辅助：基于索引的确定性伪随机（0~1）
  // 用于让背景的"随机"点缀每帧渲染位置一致，避免画面闪烁
  _hashRand(i) {
    var x = Math.sin(i * 12.9898 + 78.233) * 43758.5453;
    return x - Math.floor(x);
  }

  // 渲染地图背景（主题渐变 + 保留文字）
  renderBackground(ctx) {
    var mapW = this.cols * this.tileSize;
    var mapH = this.rows * this.tileSize;
    var offsetY = MAP_OFFSET_Y;
    var ts = this.tileSize;

    ctx.save();
    ctx.translate(0, offsetY);

    // ===== 炼狱(space)主题：太空站风格 =====
    if (this.theme === 'space') {
      // 太空站背景：深空渐变 + 星空
      var spaceGrad = ctx.createLinearGradient(0, 0, 0, mapH);
      spaceGrad.addColorStop(0, '#0A0A2E'); // 深空蓝黑
      spaceGrad.addColorStop(0.5, '#1A1A4A'); // 中段深紫
      spaceGrad.addColorStop(1, '#0A0A1A'); // 底部深黑
      ctx.fillStyle = spaceGrad;
      ctx.fillRect(0, 0, mapW, mapH);

      // 星空（确定性伪随机，避免每帧抖动）
      ctx.fillStyle = '#FFFFFF';
      for (var si = 0; si < 200; si++) {
        var sx = this._hashRand(si * 2 + 101) * mapW;
        var sy = this._hashRand(si * 2 + 102) * mapH;
        var sr = 0.5 + this._hashRand(si + 103) * 2;
        var sa = 0.3 + this._hashRand(si + 104) * 0.7;
        ctx.globalAlpha = sa;
        ctx.beginPath();
        ctx.arc(sx, sy, sr, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // 星云光晕
      var nebulaX = mapW * 0.3;
      var nebulaY = mapH * 0.35;
      var nebulaGrad = ctx.createRadialGradient(nebulaX, nebulaY, 0, nebulaX, nebulaY, mapH * 0.5);
      nebulaGrad.addColorStop(0, 'rgba(80, 40, 160, 0.15)');
      nebulaGrad.addColorStop(0.5, 'rgba(40, 20, 100, 0.08)');
      nebulaGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = nebulaGrad;
      ctx.fillRect(0, 0, mapW, mapH);

      var nebula2X = mapW * 0.7;
      var nebula2Y = mapH * 0.6;
      var nebula2Grad = ctx.createRadialGradient(nebula2X, nebula2Y, 0, nebula2X, nebula2Y, mapH * 0.4);
      nebula2Grad.addColorStop(0, 'rgba(30, 80, 160, 0.12)');
      nebula2Grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = nebula2Grad;
      ctx.fillRect(0, 0, mapW, mapH);

      // 暗角
      var vignette = ctx.createRadialGradient(
        mapW / 2, mapH / 2, mapH * 0.25,
        mapW / 2, mapH / 2, mapH * 0.75
      );
      vignette.addColorStop(0, 'rgba(0,0,0,0)');
      vignette.addColorStop(1, 'rgba(0,0,0,0.35)');
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, mapW, mapH);

    } else {
      // ===== 其他主题：原本的渐变背景 =====
      var bg = this.colors.background;
      var grad = ctx.createLinearGradient(0, 0, 0, mapH);
      grad.addColorStop(0, bg[0]);
      grad.addColorStop(1, bg[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, mapW, mapH);

      // 暗角效果（增强深度感）
      var vignette = ctx.createRadialGradient(
        mapW / 2, mapH / 2, mapH * 0.25,
        mapW / 2, mapH / 2, mapH * 0.75
      );
      vignette.addColorStop(0, 'rgba(0,0,0,0)');
      vignette.addColorStop(1, 'rgba(0,0,0,0.3)');
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, mapW, mapH);
    }

    // ===== 保留图片中的文字 =====
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 主标题：浪尖儿大学社区训练营
    ctx.font = 'bold 36px sans-serif';
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.strokeText('浪尖儿大学社区训练营', mapW / 2, mapH * 0.35);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.fillText('浪尖儿大学社区训练营', mapW / 2, mapH * 0.35);

    // 英文副标题
    ctx.font = 'italic 18px sans-serif';
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.strokeText('WavePeak Elite', mapW / 2, mapH * 0.35 - 32);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.fillText('WavePeak Elite', mapW / 2, mapH * 0.35 - 32);

    // 左上角品牌
    ctx.textAlign = 'left';
    ctx.font = 'bold 32px sans-serif';
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.strokeText('浪尖儿', 20, 35);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.fillText('浪尖儿', 20, 35);

    // 四个功能点
    ctx.textAlign = 'center';
    ctx.font = 'bold 15px sans-serif';
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.strokeText('全年50+大课直播', mapW * 0.25, mapH * 0.55);
    ctx.fillText('全年50+大课直播', mapW * 0.25, mapH * 0.55);
    ctx.strokeText('覆盖99%大学高频问题', mapW * 0.75, mapH * 0.55);
    ctx.fillText('覆盖99%大学高频问题', mapW * 0.75, mapH * 0.55);
    ctx.strokeText('成长记录 / 经验问答', mapW * 0.25, mapH * 0.72);
    ctx.fillText('成长记录 / 经验问答', mapW * 0.25, mapH * 0.72);
    ctx.strokeText('资源互助 / 圈子互动', mapW * 0.75, mapH * 0.72);
    ctx.fillText('资源互助 / 圈子互动', mapW * 0.75, mapH * 0.72);
    ctx.strokeText('实习 / 考研 / 兼职 / 保研', mapW / 2, mapH * 0.85);
    ctx.fillText('实习 / 考研 / 兼职 / 保研', mapW / 2, mapH * 0.85);
    ctx.strokeText('真实分享', mapW / 2, mapH * 0.85 + 22);
    ctx.fillText('真实分享', mapW / 2, mapH * 0.85 + 22);

    // 底部标语
    ctx.font = 'bold 17px sans-serif';
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.strokeText('一个专注培养大学精英的全国社团', mapW / 2, mapH * 0.95);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.fillText('一个专注培养大学精英的全国社团', mapW / 2, mapH * 0.95);

    // 网格线（极淡，增加科技感）
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
    ctx.lineWidth = 1;
    for (var c = 1; c < this.cols; c++) {
      ctx.beginPath();
      ctx.moveTo(c * this.tileSize, 0);
      ctx.lineTo(c * this.tileSize, mapH);
      ctx.stroke();
    }
    for (var r = 1; r < this.rows; r++) {
      ctx.beginPath();
      ctx.moveTo(0, r * this.tileSize);
      ctx.lineTo(mapW, r * this.tileSize);
      ctx.stroke();
    }

    ctx.restore();
  }

  // 渲染下层：空地、砖墙、钢墙、水域、基地
  renderBottom(ctx) {
    var ts = this.tileSize;
    for (var r = 0; r < this.rows; r++) {
      for (var c = 0; c < this.cols; c++) {
        var tile = this.grid[r][c];
        var x = c * ts;
        var y = r * ts + MAP_OFFSET_Y;
        this.drawTile(ctx, x, y, tile, r, c);
      }
    }
  }

  // 渲染上层：草丛
  renderTop(ctx) {
    var ts = this.tileSize;
    for (var r = 0; r < this.rows; r++) {
      for (var c = 0; c < this.cols; c++) {
        var tile = this.grid[r][c];
        if (isTopLayer(tile)) {
          var x = c * ts;
          var y = r * ts + MAP_OFFSET_Y;
          this.drawGrass(ctx, x, y);
        }
      }
    }
  }

  drawTile(ctx, x, y, tile, row, col) {
    var c = this.colors;
    switch (tile) {
      case TileType.EMPTY:
        // EMPTY 不再重绘，保留背景图可见
        break;
      case TileType.BRICK:
        this.drawBrick(ctx, x, y);
        break;
      case TileType.STEEL:
        this.drawSteel(ctx, x, y);
        break;
      case TileType.WATER:
        this.drawWater(ctx, x, y);
        break;
      case TileType.BASE:
        this.drawBase(ctx, x, y);
        break;
    }
  }

  drawEmpty(ctx, x, y, row, col) {
    // 空地不再遮挡背景图，保持透明
    // 可选：细微点缀
    if ((row + col) % 7 === 0) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
      ctx.fillRect(x + 12, y + 12, 2, 2);
    }
  }

  drawBrick(ctx, x, y) {
    var c = this.colors;
    // NYH 砖块增强效果（所有主题）：阴影 + 加粗砖缝 + 主题匹配亮边
    // 1. 外阴影：让砖块从背景中"浮起"
    var shadowAlpha = this.theme === 'desert' ? 0.5 : 0.35;
    ctx.fillStyle = 'rgba(0, 0, 0, ' + shadowAlpha + ')';
    ctx.fillRect(x + 1, y + 2, this.tileSize, this.tileSize);
    // 2. 主体填充
    ctx.fillStyle = c.brick;
    ctx.fillRect(x, y, this.tileSize, this.tileSize);
    // 3. 砖缝（加粗）
    ctx.strokeStyle = c.brickStroke;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    // 横向砖缝
    ctx.moveTo(x, y + 8);
    ctx.lineTo(x + this.tileSize, y + 8);
    ctx.moveTo(x, y + 16);
    ctx.lineTo(x + this.tileSize, y + 16);
    ctx.moveTo(x, y + 24);
    ctx.lineTo(x + this.tileSize, y + 24);
    // 竖向砖缝（错位）
    ctx.moveTo(x + 8, y);
    ctx.lineTo(x + 8, y + 8);
    ctx.moveTo(x + 16, y + 8);
    ctx.lineTo(x + 16, y + 16);
    ctx.moveTo(x + 8, y + 16);
    ctx.lineTo(x + 8, y + 24);
    ctx.moveTo(x + 16, y + 24);
    ctx.lineTo(x + 16, y + this.tileSize);
    ctx.stroke();
    // 4. 主题匹配亮边：让砖块在各自背景上都醒目
    var highlightMap = {
      snow: 'rgba(255, 220, 180, 0.7)',    // 雪天：暖橙亮边
      jungle: 'rgba(220, 180, 130, 0.7)', // 丛林：浅棕亮边
      city: 'rgba(255, 180, 255, 0.8)',    // 城市：亮紫亮边
      campus: 'rgba(255, 200, 150, 0.6)', // 校园：暖橙亮边
    };
    ctx.strokeStyle = highlightMap[this.theme] || 'rgba(255, 255, 255, 0.6)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, this.tileSize - 1, this.tileSize - 1);
  }

  drawSteel(ctx, x, y) {
    var c = this.colors;
    // NYH 钢块增强效果（所有主题）：阴影 + 加粗描边
    // 1. 外阴影：让钢块从背景中"浮起"
    var shadowAlpha = this.theme === 'desert' ? 0.55 : 0.4;
    ctx.fillStyle = 'rgba(0, 0, 0, ' + shadowAlpha + ')';
    ctx.fillRect(x + 1, y + 2, this.tileSize, this.tileSize);
    // 2. 主体填充
    ctx.fillStyle = c.steel;
    ctx.fillRect(x, y, this.tileSize, this.tileSize);
    // 3. 加粗描边
    ctx.strokeStyle = c.steelStroke;
    ctx.lineWidth = 2.5;
    ctx.strokeRect(x + 1, y + 1, this.tileSize - 2, this.tileSize - 2);
    // 4. 高光（左上角 L 形）
    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.fillRect(x + 3, y + 3, this.tileSize - 12, 3);
    ctx.fillRect(x + 3, y + 3, 3, this.tileSize - 12);
  }

  drawWater(ctx, x, y) {
    var c = this.colors;
    ctx.fillStyle = c.water;
    ctx.fillRect(x, y, this.tileSize, this.tileSize);
    // 波纹动画
    var wave = Math.sin(this.animTime * 0.003 + x * 0.1) * 2;
    ctx.strokeStyle = c.waterStroke;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.moveTo(x + 4, y + 10 + wave);
    ctx.quadraticCurveTo(x + 12, y + 6 + wave, x + 20, y + 10 + wave);
    ctx.quadraticCurveTo(x + 24, y + 12 + wave, x + 28, y + 10 + wave);
    ctx.moveTo(x + 4, y + 22 - wave);
    ctx.quadraticCurveTo(x + 12, y + 18 - wave, x + 20, y + 22 - wave);
    ctx.quadraticCurveTo(x + 24, y + 24 - wave, x + 28, y + 22 - wave);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  drawGrass(ctx, x, y) {
    var c = this.colors;
    ctx.fillStyle = c.grass;
    ctx.fillRect(x, y, this.tileSize, this.tileSize);
    // 深色草丛纹理
    ctx.fillStyle = c.grassDark;
    for (var i = 0; i < 6; i++) {
      var gx = x + 4 + (i * 5) % 24;
      var gy = y + 4 + ((i * 7) % 24);
      ctx.fillRect(gx, gy, 3, 3);
    }
  }

  drawBase(ctx, x, y) {
    // 基地渲染由 Base.js 的 render() 方法全权负责（城堡造型+动画）
    // 这里不绘制任何内容，避免半透明方块遮挡 Base.js 的精美绘制
  }
}

// ===== 模块: ui/UIBase.js =====
// UIBase UI 基类（按钮/面板绘制工具）

// 按钮组件
class UIButton {
  constructor(x, y, w, h, label, onClick) {
    this.x = x;
    this.y = y;
    this.w = w;
    this.h = h;
    this.label = label;
    this.onClick = onClick;
    this.hover = false;
    this.pressed = false;
  }

  update(input) {
    var mouse = input.getMouse();
    var inside = mouse.x >= this.x && mouse.x <= this.x + this.w &&
                   mouse.y >= this.y && mouse.y <= this.y + this.h;
    this.hover = inside;
    if (inside && mouse.clicked && this.onClick) {
      this.onClick();
    }
  }

  render(ctx) {
    var bgColor = this.pressed ? '#5E3DB5' : (this.hover ? '#7B5FCC' : '#4A3A8F');
    fillStrokeRoundRect(ctx, this.x, this.y, this.w, this.h, 8, bgColor, '#C2A3FF', 2);
    drawText(ctx, this.label, this.x + this.w / 2, this.y + this.h / 2, {
      font: 'bold 16px sans-serif',
      color: this.hover ? '#FFD76E' : '#FFFFFF',
      align: 'center',
      baseline: 'middle',
    });
  }
}

// 绘制玻璃拟态面板
function drawGlassPanel(ctx, x, y, w, h, r = 12) {
  ctx.save();
  ctx.fillStyle = 'rgba(74, 58, 143, 0.4)';
  fillStrokeRoundRect(ctx, x, y, w, h, r, 'rgba(74, 58, 143, 0.4)', 'rgba(194, 163, 255, 0.5)', 1.5);
  ctx.restore();
}
