// HUD 游戏内信息条

// 暂停按钮热区（用于Game.js鼠标点击检测）
function isPauseButtonClicked(mouseX, mouseY) {
  var x = CANVAS_WIDTH - 50;
  var w = 40;
  var y = HUD_HEIGHT / 2 - 14;
  var h = 28;
  return mouseX >= x - 4 && mouseX <= x + w && mouseY >= y - 2 && mouseY <= y + h + 2;
}

class HUD {
  constructor() {
    this.animTime = 0;
    this.pauseHover = false;
  }

  render(ctx, data) {
    var {
      hp, maxHp, score, enemyCount, killed, total,
      combo, scoreFlash, hpFlash, colors, difficultyLabel, pauseHover,
      ammo, maxAmmo, coins, propSpeedTimer, propShieldTimer,
    } = data;
    this.pauseHover = !!pauseHover;

    // 背景
    ctx.fillStyle = 'rgba(26, 23, 48, 0.9)';
    ctx.fillRect(0, 0, CANVAS_WIDTH, HUD_HEIGHT);
    ctx.strokeStyle = 'rgba(194, 163, 255, 0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, HUD_HEIGHT);
    ctx.lineTo(CANVAS_WIDTH, HUD_HEIGHT);
    ctx.stroke();

    // HP 显示
    var hpX = 10;
    var hpY = HUD_HEIGHT / 2;
    drawText(ctx, '❤', hpX, hpY, {
      font: '14px sans-serif',
      color: '#FF6B6B',
      align: 'left',
      baseline: 'middle',
    });
    // 血量条
    var barX = hpX + 20;
    var barW = 56;
    var barH = 10;
    var barY = hpY - barH / 2;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(barX, barY, barW, barH);
    // 血量填充
    var hpRatio = hp / maxHp;
    var hpColor = hpFlash ? '#FF6B6B' : (hpRatio > 0.5 ? '#FFD76E' : (hpRatio > 0.25 ? '#FF9E5E' : '#FF6B6B'));
    ctx.fillStyle = hpColor;
    ctx.fillRect(barX + 1, barY + 1, (barW - 2) * hpRatio, barH - 2);
    ctx.strokeStyle = 'rgba(194, 163, 255, 0.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barW, barH);
    // HP 数字
    drawText(ctx, `${hp}/${maxHp}`, barX + barW + 5, hpY, {
      font: '11px sans-serif',
      color: '#FFFFFF',
      align: 'left',
      baseline: 'middle',
    });

    // 分数
    var scoreX = 130;
    var scoreStr = String(score).padStart(6, '0');
    var scoreScale = scoreFlash ? 1.15 : 1.0;
    ctx.save();
    ctx.translate(scoreX, hpY);
    ctx.scale(scoreScale, scoreScale);
    drawText(ctx, `分数:${scoreStr}`, 0, 0, {
      font: 'bold 14px sans-serif',
      color: scoreFlash ? '#FFD76E' : '#FFFFFF',
      align: 'left',
      baseline: 'middle',
    });
    ctx.restore();

    // 敌人计数
    var enemyX = 255;
    drawText(ctx, '敌人:', enemyX, hpY, {
      font: '12px sans-serif',
      color: '#C2A3FF',
      align: 'left',
      baseline: 'middle',
    });
    // 敌人小方块图标（最多显示8个）
    var maxIcons = Math.min(enemyCount, 8);
    for (var i = 0; i < maxIcons; i++) {
      ctx.fillStyle = '#FF6B6B';
      ctx.fillRect(enemyX + 38 + i * 10, hpY - 4, 6, 6);
    }
    if (enemyCount > 8) {
      drawText(ctx, `+${enemyCount - 8}`, enemyX + 38 + maxIcons * 10 + 2, hpY, {
        font: '10px sans-serif', color: '#FF6B6B', align: 'left', baseline: 'middle',
      });
    }

    // 击杀目标（动态根据难度）
    var remainX = 365;
    var diffColor = difficultyLabel === '炼狱' ? '#B829FF'
      : (difficultyLabel === '噩梦' ? '#FF6B6B'
      : (difficultyLabel === '困难' ? '#FF9E5E' : '#7CC4FF'));
    drawText(ctx, '击杀:', remainX, hpY, {
      font: '12px sans-serif',
      color: '#C2A3FF',
      align: 'left',
      baseline: 'middle',
    });
    drawText(ctx, `${killed}/${total}`, remainX + 34, hpY, {
      font: 'bold 13px sans-serif',
      color: diffColor,
      align: 'left',
      baseline: 'middle',
    });
    // 难度标签
    if (difficultyLabel) {
      drawText(ctx, `[${difficultyLabel}]`, remainX + 80, hpY, {
        font: 'bold 11px sans-serif',
        color: diffColor,
        align: 'left',
        baseline: 'middle',
        shadow: { color: diffColor, blur: 3 },
      });
    }

    // 弹药 & 道具 & 金币（紧凑排列）
    if (ammo !== undefined) {
      var ammoX = 520;
      var ammoColor = ammo <= 2 ? '#FF6B6B' : (ammo <= 5 ? '#FFD76E' : '#7CC4FF');
      drawText(ctx, '🔫', ammoX, hpY, {
        font: '13px sans-serif', align: 'left', baseline: 'middle',
      });
      drawText(ctx, `${ammo}/${maxAmmo}`, ammoX + 18, hpY, {
        font: 'bold 12px sans-serif', color: ammoColor, align: 'left', baseline: 'middle',
      });

      // 道具效果指示
      var propX = ammoX + 52;
      if (propSpeedTimer > 0) {
        drawText(ctx, '⚡', propX, hpY, {
          font: '13px sans-serif', color: '#FFD76E', align: 'left', baseline: 'middle',
          shadow: { color: 'rgba(255,215,110,0.6)', blur: 6 },
        });
        propX += 18;
      }
      if (propShieldTimer > 0) {
        drawText(ctx, '🛡', propX, hpY, {
          font: '13px sans-serif', color: '#5CC8FF', align: 'left', baseline: 'middle',
          shadow: { color: 'rgba(92,200,255,0.6)', blur: 6 },
        });
        propX += 18;
      }

      // 金币和换弹
      var coinX = 640;
      drawText(ctx, '🪙', coinX, hpY, {
        font: '13px sans-serif', align: 'left', baseline: 'middle',
      });
      var coinColor = coins >= COINS_FOR_FULL ? '#FFD700' : (coins >= 1 ? '#FFD76E' : '#AAAAAA');
      drawText(ctx, `${coins}`, coinX + 16, hpY, {
        font: 'bold 12px sans-serif', color: coinColor, align: 'left', baseline: 'middle',
      });
      // 换弹提示
      if (coins >= COINS_FOR_FULL) {
        drawText(ctx, 'R=+10', coinX + 30, hpY, {
          font: 'bold 10px sans-serif', color: '#FFD700', align: 'left', baseline: 'middle',
        });
      } else if (coins >= 1) {
        drawText(ctx, 'R=+3', coinX + 30, hpY, {
          font: 'bold 10px sans-serif', color: '#FFD76E', align: 'left', baseline: 'middle',
        });
      }
    }

    // 连击计数器（叠加层，居中显示不遮挡其他元素）
    if (combo > 0) {
      var tier = this.getComboTier(combo);
      var color = tier ? tier.color : '#FFFFFF';
      var bigCombo = combo >= 3;
      var fontSize = bigCombo ? 30 : 14;
      var strokeW = bigCombo ? 4 : 0;
      var glow = bigCombo ? 14 : 6;
      var pulse = combo >= 3 ? 1 + Math.sin(this.animTime * 0.01) * 0.06 : 1.0;
      var comboX = Math.floor(CANVAS_WIDTH / 2);
      ctx.save();
      ctx.translate(comboX, hpY);
      ctx.scale(pulse, pulse);
      drawText(ctx, `COMBO ×${combo}`, 0, 0, {
        font: `bold ${fontSize}px sans-serif`,
        color: color,
        align: 'center',
        baseline: 'middle',
        stroke: strokeW > 0 ? 'rgba(0,0,0,0.75)' : null,
        strokeWidth: strokeW,
        shadow: { color: color, blur: glow },
      });
      ctx.restore();
    }

    // 暂停按钮（可点击样式）
    var pauseW = 36;
    var pauseH = 26;
    var pauseX = CANVAS_WIDTH - 46;
    var pauseBtnY = hpY - pauseH / 2;
    fillStrokeRoundRect(ctx, pauseX, pauseBtnY, pauseW, pauseH, 6,
      this.pauseHover ? 'rgba(255, 215, 110, 0.35)' : 'rgba(74, 58, 143, 0.4)',
      this.pauseHover ? '#FFD76E' : 'rgba(194, 163, 255, 0.6)', 1.2);
    drawText(ctx, '⏸', pauseX + pauseW / 2, hpY, {
      font: '16px sans-serif',
      color: this.pauseHover ? '#FFD76E' : '#C2A3FF',
      align: 'center',
      baseline: 'middle',
    });
    drawText(ctx, 'ESC', pauseX - 4, hpY, {
      font: '10px sans-serif',
      color: 'rgba(194, 163, 255, 0.5)',
      align: 'right',
      baseline: 'middle',
    });
  }

  getComboTier(combo) {
    for (var i = COMBO_TIERS.length - 1; i >= 0; i--) {
      if (combo >= COMBO_TIERS[i].count) return COMBO_TIERS[i];
    }
    return null;
  }

  update(dt) {
    this.animTime += dt;
  }
}

// ===== 模块: ui/MenuScreen.js =====
// MenuScreen 主菜单（地图选择界面 + 成就面板）

// 按难度递增顺序：普通(Snow) → 困难(Jungle) → 噩梦(City) → 炼狱(Campus)
var MAP_DATAS = [MapData_Airport, MapData_Glacier, MapData_Desert, MapData_Space];

class MenuScreen {
  constructor(achievements) {
    this.achievements = achievements;
    this.cardWidth = 180;
    this.cardHeight = 240;
    this.cardSpacing = 24;
    this.cards = [];
    this.hoveredCard = -1;
    this.titleAnim = 0;
    this.showHelp = false;
    this.showAchievements = false;
    this.helpButtonHover = false;
    this.achButtonHover = false;
    // 成就翻页状态
    this.achPage = 0;
    this.achPageTotal = 7; // 65 个 / 每页 10 个 = 7 页（最后一页5个）
    this.achPageSize = 10;
    this.achPrevHover = false;
    this.achNextHover = false;
    this.achCloseHover = false;
    // 帮助面板关闭按钮
    this.helpCloseHover = false;
    this.initCards();
  }

  initCards() {
    var totalWidth = this.cardWidth * MAP_DATAS.length + this.cardSpacing * (MAP_DATAS.length - 1);
    var startX = (CANVAS_WIDTH - totalWidth) / 2;
    var y = CANVAS_HEIGHT / 2 - this.cardHeight / 2 + 30;
    this.cards = MAP_DATAS.map((data, i) => ({
      x: startX + i * (this.cardWidth + this.cardSpacing),
      y,
      w: this.cardWidth,
      h: this.cardHeight,
      data,
      index: i,
    }));
  }

  update(dt, input, onSelect) {
    this.titleAnim += dt;
    var mouse = input.getMouse();

    if (this.showAchievements) {
      // ===== 成就面板交互 =====
      this.hoveredCard = -1;
      this.achPrevHover = false;
      this.achNextHover = false;
      this.achCloseHover = false;

      var panelW = 760;
      var panelH = 760;
      var panelX = (CANVAS_WIDTH - panelW) / 2;
      var panelY = (CANVAS_HEIGHT - panelH) / 2;

      // 关闭按钮（右上角）
      var closeW = 48, closeH = 36;
      var closeX = panelX + panelW - closeW - 14;
      var closeY = panelY + 16;
      this.achCloseHover = mouse.x >= closeX && mouse.x <= closeX + closeW &&
                           mouse.y >= closeY && mouse.y <= closeY + closeH;
      if (this.achCloseHover && mouse.clicked) {
        this.showAchievements = false;
        this.achPage = 0;
        return;
      }

      // 翻页按钮区
      var btnY = panelY + panelH - 64;
      // 上一页
      var prevW = 90, prevH = 40;
      var prevX = panelX + 100;
      this.achPrevHover = mouse.x >= prevX && mouse.x <= prevX + prevW &&
                          mouse.y >= btnY && mouse.y <= btnY + prevH;
      if (this.achPrevHover && mouse.clicked && this.achPage > 0) {
        this.achPage--;
      }
      // 下一页
      var nextW = 90, nextH = 40;
      var nextX = panelX + panelW - 100 - nextW;
      this.achNextHover = mouse.x >= nextX && mouse.x <= nextX + nextW &&
                          mouse.y >= btnY && mouse.y <= btnY + nextH;
      if (this.achNextHover && mouse.clicked && this.achPage < this.achPageTotal - 1) {
        this.achPage++;
      }

      // ESC 关闭成就面板
      if (input.wasPressed('pause')) {
        this.showAchievements = false;
        this.achPage = 0;
      }
      return;
    }

    if (this.showHelp) {
      this.hoveredCard = -1;
      this.helpCloseHover = false;

      // 关闭按钮（和成就面板同样布局）
      var panelW = 620;
      var panelH = 660;
      var panelX = (CANVAS_WIDTH - panelW) / 2;
      var panelY = (CANVAS_HEIGHT - panelH) / 2;
      var closeW = 48, closeH = 36;
      var closeX = panelX + panelW - closeW - 14;
      var closeY = panelY + 16;
      this.helpCloseHover = mouse.x >= closeX && mouse.x <= closeX + closeW &&
                            mouse.y >= closeY && mouse.y <= closeY + closeH;
      if (this.helpCloseHover && mouse.clicked) {
        this.showHelp = false;
        this.helpCloseHover = false;
        return;
      }
      if (input.wasPressed('pause')) {
        this.showHelp = false;
        this.helpCloseHover = false;
      }
      return;
    }

    // ===== 主菜单交互 =====
    this.hoveredCard = -1;
    for (var i = 0; i < this.cards.length; i++) {
      var c = this.cards[i];
      if (mouse.x >= c.x && mouse.x <= c.x + c.w &&
          mouse.y >= c.y && mouse.y <= c.y + c.h) {
        this.hoveredCard = i;
        if (mouse.clicked) {
          onSelect(i);
        }
        break;
      }
    }

    // 成就按钮
    var achBtnX = 30;
    var achBtnY = CANVAS_HEIGHT - 50;
    this.achButtonHover = mouse.x >= achBtnX && mouse.x <= achBtnX + 100 &&
                         mouse.y >= achBtnY && mouse.y <= achBtnY + 30;
    if (this.achButtonHover && mouse.clicked) {
      this.showAchievements = true;
      this.achPage = 0;
      this.showHelp = false;
    }

    // 帮助按钮
    var helpBtnX = CANVAS_WIDTH - 130;
    var helpBtnY = CANVAS_HEIGHT - 50;
    this.helpButtonHover = mouse.x >= helpBtnX && mouse.x <= helpBtnX + 100 &&
                           mouse.y >= helpBtnY && mouse.y <= helpBtnY + 30;
    if (this.helpButtonHover && mouse.clicked) {
      this.showHelp = !this.showHelp;
      this.showAchievements = false;
    }
  }

  render(ctx, input) {
    // 标题
    var titleY = 120 + Math.sin(this.titleAnim * 0.002) * 5;
    var grad = ctx.createLinearGradient(0, titleY - 40, 0, titleY + 20);
    grad.addColorStop(0, '#FFD76E');
    grad.addColorStop(1, '#C2A3FF');
    ctx.fillStyle = grad;
    ctx.font = 'bold 64px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(255, 215, 110, 0.5)';
    ctx.shadowBlur = 20;
    ctx.fillText('坦克大战', CANVAS_WIDTH / 2, titleY);
    ctx.shadowBlur = 0;

    // 副标题
    drawText(ctx, 'NYH 编年史', CANVAS_WIDTH / 2, titleY + 50, {
      font: '20px sans-serif',
      color: '#7CC4FF',
      align: 'center',
      baseline: 'middle',
    });

    // 提示文字
    drawText(ctx, '选择地图开始游戏', CANVAS_WIDTH / 2, titleY + 90, {
      font: '16px sans-serif',
      color: '#C2A3FF',
      align: 'center',
      baseline: 'middle',
    });

    // 三张地图卡片
    for (var i = 0; i < this.cards.length; i++) {
      this.renderCard(ctx, this.cards[i], i === this.hoveredCard);
    }

    // 成就按钮（左下角） + 进度
    var achBtnX = 30;
    var achBtnY = CANVAS_HEIGHT - 50;
    fillStrokeRoundRect(ctx, achBtnX, achBtnY, 100, 30, 6,
      this.achButtonHover ? 'rgba(255, 184, 77, 0.35)' : 'rgba(74, 58, 143, 0.4)',
      'rgba(255, 215, 110, 0.8)', 1);
    drawText(ctx, '🏆 成就', achBtnX + 50, achBtnY + 15, {
      font: '14px sans-serif',
      color: this.achButtonHover ? '#FFD76E' : '#C2A3FF',
      align: 'center',
      baseline: 'middle',
    });
    // 进度小标签
    if (this.achievements) {
      var p = this.achievements.getProgress();
      drawText(ctx, `${p.unlocked}/${p.total}`, achBtnX + 108, achBtnY + 15, {
        font: 'bold 13px sans-serif',
        color: p.unlocked === p.total ? '#FFB84D' : '#7CC4FF',
        align: 'left',
        baseline: 'middle',
      });
    }

    // 帮助按钮
    var helpBtnX = CANVAS_WIDTH - 130;
    var helpBtnY = CANVAS_HEIGHT - 50;
    fillStrokeRoundRect(ctx, helpBtnX, helpBtnY, 100, 30, 6,
      this.helpButtonHover ? 'rgba(124, 196, 255, 0.3)' : 'rgba(74, 58, 143, 0.4)',
      'rgba(194, 163, 255, 0.6)', 1);
    drawText(ctx, '操作说明', helpBtnX + 50, helpBtnY + 15, {
      font: '14px sans-serif',
      color: this.helpButtonHover ? '#FFD76E' : '#C2A3FF',
      align: 'center',
      baseline: 'middle',
    });

    // 帮助面板
    if (this.showHelp) this.renderHelp(ctx);
    // 成就面板
    if (this.showAchievements) this.renderAchievementsPanel(ctx);

    // 装饰星点
    this.renderStars(ctx);
  }

  renderCard(ctx, card, hovered) {
    var colors = ColorConfig[card.data.theme];
    var scale = hovered ? 1.05 : 1.0;
    var cx = card.x + card.w / 2;
    var cy = card.y + card.h / 2;
    var w = card.w * scale;
    var h = card.h * scale;
    var x = cx - w / 2;
    var y = cy - h / 2;

    if (hovered) {
      ctx.shadowColor = 'rgba(255, 215, 110, 0.5)';
      ctx.shadowBlur = 20;
    }
    fillStrokeRoundRect(ctx, x, y, w, h, 16,
      'rgba(42, 38, 64, 0.85)',
      hovered ? '#FFD76E' : 'rgba(194, 163, 255, 0.6)',
      hovered ? 2.5 : 1.5);
    ctx.shadowBlur = 0;

    var thumbY = y + 12;
    var thumbH = 110;
    var thumbW = w - 24;
    var thumbX = x + 12;
    this.renderThumbnail(ctx, thumbX, thumbY, thumbW, thumbH, colors, card.data);

    drawText(ctx, card.data.name, cx, y + 145, {
      font: 'bold 18px sans-serif',
      color: '#FFFFFF',
      align: 'center',
      baseline: 'middle',
      shadow: { color: 'rgba(0,0,0,0.6)', blur: 4 },
    });

    var starY = y + 175;
    var starSize = 9;
    var starSpacing = 20;
    var starCount = colors.difficulty >= 4 ? 4 : 3;
    var starStartX = cx - (starCount - 1) * starSpacing / 2;
    for (var i = 0; i < starCount; i++) {
      var sx = starStartX + i * starSpacing;
      if (i < colors.difficulty) {
        var starFill = colors.difficulty >= 4 ? '#B829FF' : '#FFD76E';
        var starStroke = colors.difficulty >= 4 ? '#5C0D8A' : '#B8952A';
        drawStar(ctx, sx, starY, 5, starSize, starSize / 2, starFill, starStroke);
      } else {
        drawStar(ctx, sx, starY, 5, starSize, starSize / 2, 'rgba(255,255,255,0.2)', null);
      }
    }

    // 难度标签（普通/困难/噩梦/炼狱）+ 攻击欲望指示
    var diffLabel = card.data.difficultyLabel || '普通';
    var diffColor = card.data.difficulty === 'purgatory' ? '#B829FF'
      : (card.data.difficulty === 'nightmare' ? '#FF6B6B'
      : (card.data.difficulty === 'hard' ? '#FF9E5E' : '#7CC4FF'));
    // 难度标签胶囊
    var labelW = 76;
    var labelH = 20;
    var labelX = cx - labelW / 2;
    var labelY = y + 195;
    fillStrokeRoundRect(ctx, labelX, labelY, labelW, labelH, 10,
      'rgba(0,0,0,0.4)', diffColor, 1.5);
    drawText(ctx, `${diffLabel}模式`, cx, labelY + labelH / 2, {
      font: 'bold 12px sans-serif',
      color: diffColor,
      align: 'center',
      baseline: 'middle',
    });

    // 击杀目标
    drawText(ctx, `击杀目标: ${card.data.killTarget || 20}`, cx, y + 225, {
      font: '11px sans-serif',
      color: '#FFFFFF',
      align: 'center',
      baseline: 'middle',
    });
  }

  renderThumbnail(ctx, x, y, w, h, colors, mapData) {
    ctx.save();

    // ===== 圆角裁剪区域 =====
    roundRect(ctx, x, y, w, h, 8);
    ctx.clip();

    // ===== 关卡主题背景填充整个缩略图 =====
    if (mapData.theme === 'airport') {
      // ===== 机场：跑道 + 航站楼风格 =====
      var grad = ctx.createLinearGradient(x, y, x, y + h);
      grad.addColorStop(0, '#7A8A9A');   // 顶部灰蓝天空
      grad.addColorStop(0.4, '#A0B0C0'); // 中部浅灰蓝
      grad.addColorStop(0.7, '#C8C8C8'); // 跑道灰
      grad.addColorStop(1, '#B0B0B0');   // 底部跑道
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, w, h);

      // 远处航站楼剪影
      ctx.fillStyle = 'rgba(140, 150, 165, 0.7)';
      ctx.beginPath();
      ctx.moveTo(x, y + h * 0.55);
      ctx.lineTo(x + w * 0.15, y + h * 0.3);
      ctx.lineTo(x + w * 0.3, y + h * 0.3);
      ctx.lineTo(x + w * 0.35, y + h * 0.42);
      ctx.lineTo(x + w * 0.5, y + h * 0.25);
      ctx.lineTo(x + w * 0.65, y + h * 0.42);
      ctx.lineTo(x + w * 0.7, y + h * 0.3);
      ctx.lineTo(x + w * 0.85, y + h * 0.3);
      ctx.lineTo(x + w, y + h * 0.55);
      ctx.lineTo(x + w, y + h * 0.7);
      ctx.lineTo(x, y + h * 0.7);
      ctx.closePath();
      ctx.fill();

      // 跑道标线
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      for (var rl = 0; rl < 5; rl++) {
        ctx.fillRect(x + 8 + rl * 35, y + h * 0.78, 20, 3);
        ctx.fillRect(x + 8 + rl * 35, y + h * 0.85, 20, 3);
      }

      // 跑道中线
      ctx.setLineDash([8, 12]);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, y + h * 0.82);
      ctx.lineTo(x + w, y + h * 0.82);
      ctx.stroke();
      ctx.setLineDash([]);

      // 底部砖块
      ctx.fillStyle = colors.brick;
      ctx.strokeStyle = colors.brickStroke;
      ctx.lineWidth = 1;
      var iceY = y + h - 18;
      for (var i = 0; i < 7; i++) {
        var bx = x + 8 + i * 27;
        ctx.fillRect(bx, iceY, 24, 12);
        ctx.strokeRect(bx, iceY, 24, 12);
      }

    } else if (mapData.theme === 'glacier') {
      // ===== 冰川：冰蓝渐变 =====
      var grad = ctx.createLinearGradient(x, y, x, y + h);
      grad.addColorStop(0, '#3A6A8A');   // 顶部深蓝
      grad.addColorStop(0.4, '#6AACD0'); // 中部冰蓝
      grad.addColorStop(0.7, '#B8E0F0'); // 浅冰蓝
      grad.addColorStop(1, '#8CC8E0');   // 底部冰面
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, w, h);

      // 远处冰山
      ctx.fillStyle = 'rgba(200, 230, 250, 0.7)';
      for (var i = 0; i < 5; i++) {
        var tx = x + 20 + i * 38;
        var ty = y + h * 0.5;
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(tx - 16, ty + 40);
        ctx.lineTo(tx + 16, ty + 40);
        ctx.closePath();
        ctx.fill();
      }

      // 冰晶点缀
      var iceColor = '#D0E8FF';
      var iceCrystals = [
        [15,15,iceColor],[40,22,'#B8DCF0'],[65,12,iceColor],[90,20,'#E0F0FF'],[115,16,iceColor],[140,24,'#B8DCF0'],[165,14,iceColor],
        [25,40,'#B8DCF0'],[55,48,iceColor],[85,42,'#E0F0FF'],[115,50,iceColor],[145,44,'#B8DCF0'],
      ];
      for (var [lx, ly, lc] of iceCrystals) {
        ctx.fillStyle = lc;
        ctx.beginPath();
        ctx.ellipse(x + lx, y + ly, 8, 4, (lx + ly) * 0.1, 0, Math.PI * 2);
        ctx.fill();
      }

      // 冰裂缝
      ctx.strokeStyle = 'rgba(140, 200, 230, 0.5)';
      ctx.lineWidth = 2;
      for (var i = 0; i < 3; i++) {
        var vx = x + 30 + i * 60;
        ctx.beginPath();
        ctx.moveTo(vx, y);
        ctx.quadraticCurveTo(vx + 8, y + h * 0.3, vx - 5, y + h * 0.6);
        ctx.quadraticCurveTo(vx + 10, y + h * 0.8, vx, y + h);
        ctx.stroke();
      }

      // 底部砖块
      ctx.fillStyle = colors.brick;
      ctx.strokeStyle = colors.brickStroke;
      ctx.lineWidth = 1;
      var gY = y + h - 18;
      for (var i = 0; i < 7; i++) {
        var bx = x + 8 + i * 27;
        ctx.fillRect(bx, gY, 24, 12);
        ctx.strokeRect(bx, gY, 24, 12);
      }
      // 冰柱尖
      ctx.fillStyle = '#D0E8FF';
      for (var i = 0; i < 7; i++) {
        var bx = x + 8 + i * 27;
        ctx.fillRect(bx + 4, gY - 4, 2, 5);
        ctx.fillRect(bx + 12, gY - 5, 2, 6);
        ctx.fillRect(bx + 20, gY - 4, 2, 5);
      }

    } else if (mapData.theme === 'desert') {
      // ===== 沙漠：沙丘日落渐变 =====
      var grad = ctx.createLinearGradient(x, y, x, y + h);
      grad.addColorStop(0, '#D48840');   // 顶部橙红天空
      grad.addColorStop(0.4, '#E8B860'); // 中部金色
      grad.addColorStop(0.7, '#EDD898'); // 沙色
      grad.addColorStop(1, '#C8A060');   // 底部沙漠
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, w, h);

      // 远处沙丘剪影
      ctx.fillStyle = 'rgba(180, 130, 70, 0.6)';
      ctx.beginPath();
      ctx.moveTo(x, y + h * 0.55);
      ctx.quadraticCurveTo(x + w * 0.2, y + h * 0.35, x + w * 0.4, y + h * 0.5);
      ctx.quadraticCurveTo(x + w * 0.6, y + h * 0.28, x + w * 0.8, y + h * 0.45);
      ctx.quadraticCurveTo(x + w * 0.9, y + h * 0.35, x + w, y + h * 0.5);
      ctx.lineTo(x + w, y + h * 0.7);
      ctx.lineTo(x, y + h * 0.7);
      ctx.closePath();
      ctx.fill();

      // 太阳
      ctx.fillStyle = 'rgba(255, 200, 80, 0.9)';
      ctx.shadowColor = '#FFC850';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(x + w - 35, y + 30, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // 仙人掌点缀
      ctx.fillStyle = 'rgba(80, 120, 50, 0.7)';
      var cacti = [[25,45],[65,40],[105,48],[145,42]];
      for (var [cx, cy] of cacti) {
        ctx.fillRect(x + cx - 2, y + cy - 15, 4, 18);
        ctx.fillRect(x + cx - 6, y + cy - 8, 4, 2);
        ctx.fillRect(x + cx + 2, y + cy - 12, 4, 2);
      }

      // 底部砖块
      ctx.fillStyle = colors.brick;
      ctx.strokeStyle = colors.brickStroke;
      ctx.lineWidth = 1;
      var gY = y + h - 18;
      for (var i = 0; i < 7; i++) {
        var bx = x + 8 + i * 27;
        ctx.fillRect(bx, gY, 24, 12);
        ctx.strokeRect(bx, gY, 24, 12);
      }

    } else if (mapData.theme === 'space') {
      // ===== 太空：深邃星空渐变 =====
      var grad = ctx.createLinearGradient(x, y, x, y + h);
      grad.addColorStop(0, '#05051A');   // 顶部深黑
      grad.addColorStop(0.4, '#0A0A2E'); // 深蓝紫
      grad.addColorStop(0.7, '#151540'); // 中段深紫
      grad.addColorStop(1, '#0A0A1A');   // 底部深黑
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, w, h);

      // 星空
      ctx.fillStyle = '#FFFFFF';
      for (var si = 0; si < 60; si++) {
        var sr = Math.sin(si * 12.9898 + 78.233) * 43758.5453;
        sr = sr - Math.floor(sr);
        var sr2 = Math.sin(si * 12.9898 + 91.123) * 43758.5453;
        sr2 = sr2 - Math.floor(sr2);
        var sr3 = Math.sin(si * 12.9898 + 105.456) * 43758.5453;
        sr3 = sr3 - Math.floor(sr3);
        ctx.globalAlpha = 0.3 + sr3 * 0.7;
        ctx.beginPath();
        ctx.arc(x + sr * w, y + sr2 * h, 0.5 + sr3 * 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // 星云光晕
      var nebulaGrad = ctx.createRadialGradient(x + w * 0.35, y + h * 0.4, 0, x + w * 0.35, y + h * 0.4, h * 0.5);
      nebulaGrad.addColorStop(0, 'rgba(80, 40, 160, 0.2)');
      nebulaGrad.addColorStop(0.5, 'rgba(40, 20, 100, 0.1)');
      nebulaGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = nebulaGrad;
      ctx.fillRect(x, y, w, h);

      // 行星
      ctx.fillStyle = 'rgba(180, 140, 220, 0.6)';
      ctx.shadowColor = '#8866CC';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(x + w - 30, y + 25, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // 行星环
      ctx.strokeStyle = 'rgba(200, 180, 240, 0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(x + w - 30, y + 25, 14, 4, 0.3, 0, Math.PI * 2);
      ctx.stroke();

      // 底部砖块
      ctx.fillStyle = colors.brick;
      ctx.strokeStyle = colors.brickStroke;
      ctx.lineWidth = 1;
      var gY = y + h - 18;
      for (var i = 0; i < 7; i++) {
        var bx = x + 8 + i * 27;
        ctx.fillRect(bx, gY, 24, 12);
        ctx.strokeRect(bx, gY, 24, 12);
      }
    }

    ctx.restore();

    // ===== 圆角边框 =====
    fillStrokeRoundRect(ctx, x, y, w, h, 8, 'rgba(0,0,0,0)', colors.brickStroke, 1.5);

    // ===== 保留背景中的文字：难度标签 + 击杀目标 =====
    var diffLabel = mapData.difficultyLabel || '普通';
    var diffColor = mapData.difficulty === 'purgatory' ? '#B829FF'
      : (mapData.difficulty === 'nightmare' ? '#FF6B6B'
      : (mapData.difficulty === 'hard' ? '#FF9E5E' : '#7CC4FF'));

    // 文字描边 + 发光（让文字在任何背景上都清晰）
    ctx.font = 'bold 34px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.strokeText(diffLabel, x + w / 2, y + h / 2 - 12);
    ctx.fillStyle = diffColor;
    ctx.shadowColor = diffColor;
    ctx.shadowBlur = 12;
    ctx.fillText(diffLabel, x + w / 2, y + h / 2 - 12);
    ctx.shadowBlur = 0;

    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.font = 'bold 14px sans-serif';
    var goalText = `目标 ${mapData.killTarget || 20} 杀`;
    ctx.strokeText(goalText, x + w / 2, y + h / 2 + 22);
    ctx.fillStyle = '#FFFFFF';
    ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
    ctx.shadowBlur = 4;
    ctx.fillText(goalText, x + w / 2, y + h / 2 + 22);
    ctx.shadowBlur = 0;
  }

  renderHelp(ctx) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    var panelW = 620;
    var panelH = 660;
    var panelX = (CANVAS_WIDTH - panelW) / 2;
    var panelY = (CANVAS_HEIGHT - panelH) / 2;
    fillStrokeRoundRect(ctx, panelX, panelY, panelW, panelH, 16,
      'rgba(42, 38, 64, 0.95)', '#C2A3FF', 2);

    // ===== 关闭按钮（右上角 X）=====
    var closeW = 48, closeH = 36;
    var closeX = panelX + panelW - closeW - 14;
    var closeY = panelY + 16;
    fillStrokeRoundRect(ctx, closeX, closeY, closeW, closeH, 8,
      this.helpCloseHover ? 'rgba(255, 107, 107, 0.35)' : 'rgba(74, 58, 143, 0.4)',
      this.helpCloseHover ? '#FF6B6B' : 'rgba(194, 163, 255, 0.6)', 1.5);
    drawText(ctx, '✕ 退出', closeX + closeW / 2, closeY + closeH / 2, {
      font: 'bold 13px sans-serif',
      color: this.helpCloseHover ? '#FF6B6B' : '#FFFFFF',
      align: 'center',
      baseline: 'middle',
    });

    drawText(ctx, '⚙ 操作说明 & 系统介绍', CANVAS_WIDTH / 2, panelY + 38, {
      font: 'bold 24px sans-serif',
      color: '#FFD76E',
      align: 'center',
      baseline: 'middle',
    });

    // 两列布局，各自独立的 y 坐标
    var col1X = panelX + 30;
    var col2X = panelX + panelW / 2 + 10;
    var lineH = 18;

    function drawSection(ctx, x, y, title, items, titleColor) {
      drawText(ctx, title, x, y, {
        font: 'bold 14px sans-serif',
        color: titleColor || '#FFD76E',
        align: 'left',
        baseline: 'middle',
      });
      y += 22;
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        if (item === '') { y += 6; continue; }
        if (typeof item === 'string') {
          drawText(ctx, item, x, y, {
            font: '12px sans-serif',
            color: '#FFFFFF',
            align: 'left',
            baseline: 'middle',
          });
        } else {
          drawText(ctx, item[0], x, y, {
            font: '12px sans-serif',
            color: '#7CC4FF',
            align: 'left',
            baseline: 'middle',
          });
          drawText(ctx, item[1], x + 185, y, {
            font: '12px sans-serif',
            color: '#FFFFFF',
            align: 'left',
            baseline: 'middle',
          });
        }
        y += lineH;
      }
      return y;
    }

    var leftLy = panelY + 72;
    var rightLy = panelY + 72;

    // ===== 左列：键位操作 + 游戏目标 + 难度 + 连击 =====
    leftLy = drawSection(ctx, col1X, leftLy, '🎮 键位操作', [
      ['移动', '方向键 / WASD'],
      ['开火', '空格 / J'],
      ['换弹', 'R 键（消耗金币）'],
      ['暂停', 'ESC / P'],
      ['', ''],
      ['移动端操作', ''],
      ['移动', '左下虚拟方向键'],
      ['开火', '右下红色按钮'],
      ['换弹', '右下换弹按钮'],
      ['暂停', '右下⏸按钮'],
    ], '#FFD76E');

    leftLy = drawSection(ctx, col1X, leftLy, '🎯 游戏目标', [
      '1. 消灭指定数量敌方坦克',
      '2. 保护己方基地不被摧毁',
      '3. 管理弹药，及时换弹',
      '4. 躲避炮弹雨轰炸',
    ], '#FFD76E');

    leftLy = drawSection(ctx, col1X, leftLy, '📊 难度系统', [
      '普通：击杀20 / 较被动 / HP 3',
      '困难：击杀40 / 主动追击 / HP 4',
      '噩梦：击杀60 / 疯狂追击 / HP 5',
      '炼狱：击杀80 / 死命追击 / HP 6',
    ], '#FFD76E');

    drawSection(ctx, col1X, leftLy, '⚡ 连击系统', [
      '每击杀敌人即叠加（受击清零）',
      '×3 连击：1.5 倍分数',
      '×5 连击：2.0 倍分数',
      '×10 连击：3.0 倍分数 + 震动',
    ], '#FFD76E');

    // ===== 右列：系统介绍 =====
    rightLy = drawSection(ctx, col2X, rightLy, '🔫 弹药系统', [
      ['初始弹药', '10 发子弹'],
      ['弹药耗尽', '无法开火，中央提示'],
      ['换弹方式', '按R消耗金币立即补充'],
      ['1枚金币', '恢复3发子弹'],
      ['3枚金币', '恢复10发子弹（满弹）'],
      ['', ''],
    ], '#FFD76E');

    rightLy = drawSection(ctx, col2X, rightLy, '🪙 金币 & 道具', [
      '击杀敌人：50%金币 / 30%道具',
      '走到金币上自动收集',
      '按R键消耗金币换子弹',
      '⚡速度：5秒加速   🛡护盾：5秒无敌',
      '🔫弹药：立即恢复3发子弹',

// ResultScreen 胜利/失败结算界面

class ResultScreen {
  constructor() {
    this.stats = null;
    this.animTime = 0;
    this.buttonHover = false;
  }

  setStats(stats) {
    this.stats = stats;
    this.animTime = 0;
  }

  update(dt, input, state, onReturn) {
    this.animTime += dt;
    var mouse = input.getMouse();

    // 返回按钮
    var btnW = 180;
    var btnH = 44;
    var btnX = (CANVAS_WIDTH - btnW) / 2;
    var btnY = CANVAS_HEIGHT / 2 + 120;
    this.buttonHover = mouse.x >= btnX && mouse.x <= btnX + btnW &&
                       mouse.y >= btnY && mouse.y <= btnY + btnH;

    if (input.wasPressed('confirm') || (this.buttonHover && mouse.clicked)) {
      onReturn();
    }
  }

  render(ctx, input) {
    if (!this.stats) return;

    // 半透明遮罩
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    // 面板
    var panelW = 480;
    var panelH = 400;
    var panelX = (CANVAS_WIDTH - panelW) / 2;
    var panelY = (CANVAS_HEIGHT - panelH) / 2;

    // 入场动画
    var animProgress = Math.min(this.animTime / 400, 1);
    var offsetY = (1 - animProgress) * 30;
    var alpha = animProgress;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(0, offsetY);

    fillStrokeRoundRect(ctx, panelX, panelY, panelW, panelH, 16,
      'rgba(42, 38, 64, 0.95)',
      this.stats.win ? '#FFD76E' : '#FF6B6B',

    var titleY = panelY + 60;

      font: 'bold 48px sans-serif',
      color: titleColor,
      align: 'center',
      baseline: 'middle',
      shadow: { color: titleColor, blur: 16 },
    });

    if (this.stats.win) {
      drawText(ctx, '基地保卫成功', CANVAS_WIDTH / 2, titleY + 40, {
        font: '16px sans-serif',
        color: '#C2A3FF',
        align: 'center',
        baseline: 'middle',
      });
    } else {
      drawText(ctx, this.stats.hpLeft === 0 ? '坦克被摧毁' : '基地被摧毁', CANVAS_WIDTH / 2, titleY + 40, {
        font: '16px sans-serif',
        color: '#C2A3FF',
        align: 'center',
        baseline: 'middle',
      });
    }

    // 统计数据
    var statY = titleY + 90;
    var killTarget = this.stats.killTarget || 20;
    var stats = [
      ['击杀敌人', `${this.stats.killed} / ${killTarget}`],
      ['剩余血量', `${this.stats.hpLeft} ❤`],
      ['胜利奖励', this.stats.bonus > 0 ? `+${this.stats.bonus}` : '-'],
    ];

    var sy = statY;
    for (var [label, value] of stats) {
      drawText(ctx, label, panelX + 80, sy, {
        font: '16px sans-serif',
        color: '#7CC4FF',
        align: 'left',
        baseline: 'middle',
      });
      drawText(ctx, value, panelX + panelW - 80, sy, {
        font: 'bold 18px sans-serif',
        color: '#FFFFFF',
        align: 'right',
        baseline: 'middle',
      });
      sy += 30;
    }

    // 分割线
    ctx.strokeStyle = 'rgba(194, 163, 255, 0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(panelX + 60, sy + 5);
    ctx.lineTo(panelX + panelW - 60, sy + 5);
    ctx.stroke();

    // 总分
    sy += 30;
    drawText(ctx, '总分', panelX + 80, sy, {
      font: 'bold 18px sans-serif',
      color: '#FFD76E',
      align: 'left',
      baseline: 'middle',
    });
    drawText(ctx, String(this.stats.score), panelX + panelW - 80, sy, {
      font: 'bold 24px sans-serif',
      color: '#FFD76E',
      align: 'right',
      baseline: 'middle',
      shadow: { color: '#FFD76E', blur: 8 },
    });

    // 返回按钮
    var btnW = 180;
    var btnH = 44;
    var btnX = (CANVAS_WIDTH - btnW) / 2;
    var btnY = panelY + panelH - 70;
    var btnColor = this.buttonHover ? '#5E3DB5' : '#4A3A8F';
    fillStrokeRoundRect(ctx, btnX, btnY, btnW, btnH, 8, btnColor,
      this.buttonHover ? '#FFD76E' : '#C2A3FF', 2);

      font: 'bold 16px sans-serif',

    drawText(ctx, '按 Enter / 点击屏幕确认', CANVAS_WIDTH / 2, btnY + btnH + 20, {
      font: '12px sans-serif',
      color: 'rgba(194, 163, 255, 0.6)',

      baseline: 'middle',

  }

function isPlaying(state) {
  return state === GameState.PLAYING;
}
